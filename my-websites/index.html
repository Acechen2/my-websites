<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🎴 卡牌消除</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a1a;--card:#161630;--accent:#ff6b9d;--cyan:#00e5ff;--gold:#ffd700;--green:#00e676;--purple:#a855f7;--orange:#ff9100;--text:#e8eaf6;--muted:#7986cb;--border:rgba(255,255,255,.1)}
html,body{overflow:hidden;height:100%;width:100%;touch-action:none;background:var(--bg)}
body{color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}

/* BG particles */
.bg-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* Header */
.header{position:fixed;top:0;left:0;right:0;z-index:20;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}
.header-box{background:rgba(22,22,48,.9);backdrop-filter:blur(8px);border:1px solid var(--border);border-radius:10px;padding:6px 14px;pointer-events:auto}
.header-label{font-size:.55em;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.header-value{font-family:'Orbitron',monospace;font-size:1.1em;font-weight:700}
.score-color{color:var(--gold)}
.combo-color{color:var(--accent)}
.moves-color{color:var(--cyan)}
.level-color{color:var(--purple)}

/* Board */
.board-wrap{position:relative;z-index:10}
.board{display:grid;gap:6px;padding:12px;background:rgba(22,22,48,.85);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.cell{position:relative;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.6em;transition:transform .15s,box-shadow .15s;background:var(--card);border:2px solid var(--border)}
.cell:hover{transform:scale(1.08);box-shadow:0 0 12px rgba(255,107,157,.3)}
.cell:active{transform:scale(.92)}
.cell.selected{border-color:var(--accent);box-shadow:0 0 20px rgba(255,107,157,.5);transform:scale(1.1);z-index:5}
.cell.hint{animation:hintPulse .6s ease-in-out infinite alternate}
@keyframes hintPulse{from{box-shadow:0 0 8px rgba(0,229,255,.3)}to{box-shadow:0 0 20px rgba(0,229,255,.7)}}
.cell.matched{animation:matchPop .35s ease-out forwards}
@keyframes matchPop{0%{transform:scale(1);opacity:1}50%{transform:scale(1.3);opacity:.8}100%{transform:scale(0);opacity:0}}
.cell.falling{animation:fallIn .3s ease-out}
@keyframes fallIn{from{transform:translateY(-60px);opacity:0}to{transform:translateY(0);opacity:1}}
.cell.swap-left{animation:swapL .2s ease-in-out}
.cell.swap-right{animation:swapR .2s ease-in-out}
@keyframes swapL{0%{transform:translateX(0)}50%{transform:translateX(-110%)}100%{transform:translateX(0)}}
@keyframes swapR{0%{transform:translateX(0)}50%{transform:translateX(110%)}100%{transform:translateX(0)}}

/* Card types - emoji + glow */
.cell[data-type="0"]{border-color:#ff6b9d55;text-shadow:0 0 10px #ff6b9d}
.cell[data-type="1"]{border-color:#00e5ff55;text-shadow:0 0 10px #00e5ff}
.cell[data-type="2"]{border-color:#ffd70055;text-shadow:0 0 10px #ffd700}
.cell[data-type="3"]{border-color:#00e67655;text-shadow:0 0 10px #00e676}
.cell[data-type="4"]{border-color:#a855f755;text-shadow:0 0 10px #a855f7}
.cell[data-type="5"]{border-color:#ff910055;text-shadow:0 0 10px #ff9100}

/* Float text */
.float-text{position:fixed;pointer-events:none;z-index:30;font-family:'Orbitron',monospace;font-weight:900;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-50px) scale(.6)}}

/* Combo */
.combo-display{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;font-family:'Orbitron',monospace;font-weight:900;font-size:2.5em;pointer-events:none;opacity:0;transition:all .3s}
.combo-display.show{opacity:1;animation:comboBounce .5s ease-out}
@keyframes comboBounce{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}60%{transform:translate(-50%,-50%) scale(1.2);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* Start screen */
.start-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:rgba(10,10,26,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.start-screen.hidden{opacity:0;pointer-events:none}
.start-screen h1{font-family:'Orbitron',monospace;font-size:2.4em;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--gold),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.start-screen .sub{color:var(--muted);font-size:.8em;letter-spacing:3px;margin-bottom:24px}
.start-btn{font-family:'Orbitron',monospace;font-size:1em;font-weight:700;padding:14px 36px;border-radius:14px;border:2px solid var(--accent);background:rgba(255,107,157,.1);color:var(--accent);cursor:pointer;transition:all .3s;letter-spacing:1px}
.start-btn:hover{background:rgba(255,107,157,.25);transform:scale(1.05);box-shadow:0 0 20px rgba(255,107,157,.3)}
.start-screen .hint{margin-top:20px;color:var(--muted);font-size:.7em;text-align:center;line-height:2}
.start-screen .hint kbd{background:var(--card);border:1px solid var(--border);border-radius:4px;padding:2px 6px;color:var(--cyan);font-family:'Orbitron',monospace;font-size:.8em}

/* Level complete */
.level-complete{position:fixed;top:0;left:0;width:100%;height:100%;z-index:80;background:rgba(10,10,26,.9);display:none;align-items:center;justify-content:center}
.level-complete.show{display:flex}
.lc-card{background:var(--card);border:2px solid var(--gold);border-radius:20px;padding:30px 40px;text-align:center;animation:popIn .4s}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.lc-card h2{font-family:'Orbitron',monospace;font-size:1.6em;color:var(--gold);margin-bottom:8px}
.lc-card .stars{font-size:2em;margin:10px 0}
.lc-card .stats{color:var(--muted);font-size:.85em;margin:8px 0;line-height:1.8}
.lc-card button{margin-top:12px;padding:10px 28px;border-radius:10px;border:2px solid var(--cyan);background:rgba(0,229,255,.1);color:var(--cyan);font-family:'Orbitron',monospace;font-weight:700;cursor:pointer;transition:all .2s;font-size:.9em}
.lc-card button:hover{background:rgba(0,229,255,.2);transform:scale(1.05)}

/* Game over */
.gameover{position:fixed;top:0;left:0;width:100%;height:100%;z-index:80;background:rgba(10,10,26,.9);display:none;align-items:center;justify-content:center}
.gameover.show{display:flex}
.go-card{background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:30px 40px;text-align:center;animation:popIn .4s}
.go-card h2{font-family:'Orbitron',monospace;font-size:1.6em;color:var(--accent);margin-bottom:8px}
.go-card .stats{color:var(--muted);font-size:.85em;margin:8px 0;line-height:1.8}
.go-card button{margin-top:12px;padding:10px 28px;border-radius:10px;border:2px solid var(--accent);background:rgba(255,107,157,.1);color:var(--accent);font-family:'Orbitron',monospace;font-weight:700;cursor:pointer;transition:all .2s;font-size:.9em}
.go-card button:hover{background:rgba(255,107,157,.2);transform:scale(1.05)}

/* Toolbar */
.toolbar{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:8px}
.tool-btn{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:.8em;transition:all .2s;display:flex;align-items:center;gap:4px}
.tool-btn:hover{border-color:var(--cyan);background:rgba(0,229,255,.08)}
.tool-btn:active{transform:scale(.93)}
.tool-btn .t-icon{font-size:1.1em}

/* Responsive */
@media(max-width:500px){
  .header{padding:6px 10px}
  .header-box{padding:4px 10px;border-radius:8px}
  .header-value{font-size:.9em}
  .board{gap:4px;padding:8px;border-radius:12px}
  .cell{font-size:1.2em;border-radius:8px}
  .start-screen h1{font-size:1.6em}
  .combo-display{font-size:1.8em}
  .toolbar{bottom:6px;gap:6px}
  .tool-btn{padding:6px 12px;font-size:.7em}
}
@media(max-width:360px){
  .cell{font-size:1em;border-radius:6px}
  .board{gap:3px;padding:6px}
}
</style>
</head>
<body>

<canvas class="bg-canvas" id="bgCanvas"></canvas>

<!-- Header -->
<div class="header">
  <div class="header-box">
    <div class="header-label">分数</div>
    <div class="header-value score-color" id="scoreVal">0</div>
  </div>
  <div class="header-box">
    <div class="header-label">连击</div>
    <div class="header-value combo-color" id="comboVal">0</div>
  </div>
  <div class="header-box">
    <div class="header-label">步数</div>
    <div class="header-value moves-color" id="movesVal">30</div>
  </div>
  <div class="header-box">
    <div class="header-label">关卡</div>
    <div class="header-value level-color" id="levelVal">1</div>
  </div>
</div>

<!-- Board -->
<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- Combo display -->
<div class="combo-display" id="comboDisplay"></div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="tool-btn" onclick="useHint()"><span class="t-icon">💡</span>提示</div>
  <div class="tool-btn" onclick="useShuffle()"><span class="t-icon">🔀</span>洗牌</div>
  <div class="tool-btn" onclick="useBomb()"><span class="t-icon">💣</span>炸弹</div>
</div>

<!-- Start screen -->
<div class="start-screen" id="startScreen">
  <h1>CARD CRUSH</h1>
  <div class="sub">卡 牌 消 除 大 作 战</div>
  <button class="start-btn" onclick="startGame()">🎴 开始游戏</button>
  <div class="hint">
    点击相邻卡牌交换位置<br>
    3个或以上相同卡牌连成一线即消除<br>
    📱 触摸滑动 / 鼠标点击均可操作
  </div>
</div>

<!-- Level complete -->
<div class="level-complete" id="levelComplete">
  <div class="lc-card">
    <h2>🎉 关卡完成!</h2>
    <div class="stars" id="lcStars"></div>
    <div class="stats" id="lcStats"></div>
    <button onclick="nextLevel()">下一关 ▶</button>
  </div>
</div>

<!-- Game over -->
<div class="gameover" id="gameover">
  <div class="go-card">
    <h2>💀 步数用尽</h2>
    <div class="stats" id="goStats"></div>
    <button onclick="restartGame()">🔄 再来一次</button>
  </div>
</div>

<script>
// ========== BACKGROUND PARTICLES ==========
const bgC=document.getElementById('bgCanvas');
const bgX=bgC.getContext('2d');
let bgW,bgH;
const bgParticles=[];

function resizeBg(){
  bgW=bgC.width=window.innerWidth;
  bgH=bgC.height=window.innerHeight;
}
window.addEventListener('resize',resizeBg);
resizeBg();

for(let i=0;i<60;i++){
  bgParticles.push({
    x:Math.random()*bgW,y:Math.random()*bgH,
    vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,
    r:1+Math.random()*2,
    a:.2+Math.random()*.4,
    color:['#ff6b9d','#00e5ff','#ffd700','#a855f7','#00e676','#ff9100'][Math.floor(Math.random()*6)]
  });
}

function drawBg(){
  bgX.fillStyle='#0a0a1a';
  bgX.fillRect(0,0,bgW,bgH);
  bgParticles.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;
    if(p.x<0)p.x=bgW;if(p.x>bgW)p.x=0;
    if(p.y<0)p.y=bgH;if(p.y>bgH)p.y=0;
    bgX.globalAlpha=p.a;
    bgX.fillStyle=p.color;
    bgX.beginPath();bgX.arc(p.x,p.y,p.r,0,Math.PI*2);bgX.fill();
  });
  bgX.globalAlpha=1;
  requestAnimationFrame(drawBg);
}
drawBg();

// ========== GAME CONFIG ==========
const CARD_TYPES=['🔥','💎','⭐','🍀','🔮','🌙'];
const CARD_COLORS=['#ff6b9d','#00e5ff','#ffd700','#00e676','#a855f7','#ff9100'];
const ROWS=8,COLS=8;

let grid=[];
let score=0,combo=0,moves=30,level=1;
let targetScore=1000;
let selected=null;
let animating=false;
let hintTimer=null;
let particles=[];

// ========== GAME LOGIC ==========
function initGrid(){
  grid=[];
  for(let r=0;r<ROWS;r++){
    grid[r]=[];
    for(let c=0;c<COLS;c++){
      grid[r][c]=randomType(r,c);
    }
  }
}

function randomType(r,c){
  let t;
  do{
    t=Math.floor(Math.random()*CARD_TYPES.length);
  }while(wouldMatch(r,c,t));
  return t;
}

function wouldMatch(r,c,type){
  // Check left
  if(c>=2 && grid[r][c-1]===type && grid[r][c-2]===type) return true;
  // Check up
  if(r>=2 && grid[r-1] && grid[r-1][c]===type && grid[r-2] && grid[r-2][c]===type) return true;
  return false;
}

function renderBoard(){
  const board=document.getElementById('board');
  const maxW=Math.min(window.innerWidth-32,480);
  const cellSize=Math.floor((maxW-12*2-6*(COLS-1))/COLS);
  board.style.gridTemplateColumns=`repeat(${COLS},${cellSize}px)`;
  board.style.gridTemplateRows=`repeat(${ROWS},${cellSize}px)`;
  board.innerHTML='';

  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      const cell=document.createElement('div');
      cell.className='cell';
      cell.dataset.row=r;
      cell.dataset.col=c;
      cell.dataset.type=grid[r][c];
      cell.textContent=CARD_TYPES[grid[r][c]];
      cell.style.width=cellSize+'px';
      cell.style.height=cellSize+'px';
      cell.style.fontSize=(cellSize*0.5)+'px';
      cell.addEventListener('click',()=>onCellClick(r,c));
      cell.addEventListener('touchstart',e=>onTouchStart(e,r,c),{passive:false});
      cell.addEventListener('touchmove',e=>onTouchMove(e),{passive:false});
      cell.addEventListener('touchend',e=>onTouchEnd(e,r,c),{passive:false});
      board.appendChild(cell);
    }
  }
}

function getCell(r,c){
  return document.querySelector(`.cell[data-row="${r}"][data-col="${c}"]`);
}

// ========== INPUT ==========
let touchStartX=0,touchStartY=0,touchCell=null;

function onTouchStart(e,r,c){
  e.preventDefault();
  touchStartX=e.touches[0].clientX;
  touchStartY=e.touches[0].clientY;
  touchCell={r,c};
}

function onTouchMove(e){
  e.preventDefault();
}

function onTouchEnd(e,r,c){
  if(!touchCell)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  const threshold=20;

  if(Math.abs(dx)<threshold && Math.abs(dy)<threshold){
    // Tap = click
    onCellClick(touchCell.r,touchCell.c);
  } else {
    // Swipe
    let tr=touchCell.r,tc=touchCell.c;
    if(Math.abs(dx)>Math.abs(dy)){
      tc+=dx>0?1:-1;
    } else {
      tr+=dy>0?1:-1;
    }
    if(tr>=0&&tr<ROWS&&tc>=0&&tc<COLS){
      trySwap(touchCell.r,touchCell.c,tr,tc);
    }
  }
  touchCell=null;
}

function onCellClick(r,c){
  if(animating)return;
  clearHint();

  if(!selected){
    selected={r,c};
    getCell(r,c).classList.add('selected');
  } else {
    const sr=selected.r,sc=selected.c;
    getCell(sr,sc).classList.remove('selected');

    if(sr===r && sc===c){
      selected=null;
      return;
    }

    // Check adjacency
    const dr=Math.abs(sr-r),dc=Math.abs(sc-c);
    if((dr===1&&dc===0)||(dr===0&&dc===1)){
      trySwap(sr,sc,r,c);
    } else {
      // Select new
      selected={r,c};
      getCell(r,c).classList.add('selected');
      return;
    }
    selected=null;
  }
}

function trySwap(r1,c1,r2,c2){
  if(animating)return;
  animating=true;

  // Swap in grid
  [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];

  // Check for matches
  const matches=findMatches();
  if(matches.length===0){
    // Swap back
    [grid[r1][c1],grid[r2][c2]]=[grid[r2][c2],grid[r1][c1]];
    // Shake animation
    const c1El=getCell(r1,c1),c2El=getCell(r2,c2);
    if(c1El)c1El.style.animation='shake .3s';
    if(c2El)c2El.style.animation='shake .3s';
    setTimeout(()=>{
      if(c1El)c1El.style.animation='';
      if(c2El)c2El.style.animation='';
      animating=false;
    },300);
    return;
  }

  // Valid move
  moves--;
  updateHUD();
  combo=0;
  renderBoard();
  processMatches();
}

// ========== MATCH DETECTION ==========
function findMatches(){
  const matched=new Set();

  // Horizontal
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS-2;c++){
      if(grid[r][c]===-1)continue;
      const t=grid[r][c];
      let len=1;
      while(c+len<COLS && grid[r][c+len]===t) len++;
      if(len>=3){
        for(let i=0;i<len;i++) matched.add(r*COLS+(c+i));
      }
      c+=len-1;
    }
  }

  // Vertical
  for(let c=0;c<COLS;c++){
    for(let r=0;r<ROWS-2;r++){
      if(grid[r][c]===-1)continue;
      const t=grid[r][c];
      let len=1;
      while(r+len<ROWS && grid[r+len][c]===t) len++;
      if(len>=3){
        for(let i=0;i<len;i++) matched.add((r+i)*COLS+c);
      }
      r+=len-1;
    }
  }

  return Array.from(matched).map(idx=>({r:Math.floor(idx/COLS),c:idx%COLS}));
}

// ========== MATCH PROCESSING ==========
async function processMatches(){
  let matches=findMatches();

  while(matches.length>0){
    combo++;
    const matchScore=matches.length*10*combo;
    score+=matchScore;

    // Show combo
    if(combo>=2) showCombo(combo);

    // Show score float
    const midMatch=matches[Math.floor(matches.length/2)];
    spawnFloatText(midMatch.r,midMatch.c,'+'+matchScore,combo>=3?'#ffd700':'#fff');

    // Animate matched cells
    matches.forEach(m=>{
      const cell=getCell(m.r,m.c);
      if(cell){
        cell.classList.add('matched');
        spawnMatchParticles(cell,CARD_COLORS[grid[m.r][m.c]]);
      }
    });

    await sleep(350);

    // Remove matched
    matches.forEach(m=>grid[m.r][m.c]=-1);

    // Gravity
    await applyGravity();

    // Fill empty
    await fillEmpty();

    renderBoard();
    updateHUD();

    // Check for new matches
    matches=findMatches();
  }

  // Check win/lose
  if(score>=targetScore){
    levelComplete();
  } else if(moves<=0){
    gameOver();
  } else {
    // Auto hint after 5s
    hintTimer=setTimeout(showHint,5000);
  }

  animating=false;
}

async function applyGravity(){
  let fell=false;
  for(let c=0;c<COLS;c++){
    let writeRow=ROWS-1;
    for(let r=ROWS-1;r>=0;r--){
      if(grid[r][c]!==-1){
        if(r!==writeRow){
          grid[writeRow][c]=grid[r][c];
          grid[r][c]=-1;
          fell=true;
        }
        writeRow--;
      }
    }
  }
  if(fell){
    renderBoard();
    // Add falling animation
    document.querySelectorAll('.cell').forEach(cell=>{
      const r=+cell.dataset.row;
      const c=+cell.dataset.col;
      if(grid[r][c]!==-1) cell.classList.add('falling');
    });
    await sleep(300);
  }
}

async function fillEmpty(){
  let filled=false;
  for(let c=0;c<COLS;c++){
    for(let r=0;r<ROWS;r++){
      if(grid[r][c]===-1){
        grid[r][c]=Math.floor(Math.random()*CARD_TYPES.length);
        filled=true;
      }
    }
  }
  if(filled){
    renderBoard();
    document.querySelectorAll('.cell').forEach(cell=>{
      const r=+cell.dataset.row;
      if(r<3) cell.classList.add('falling');
    });
    await sleep(300);
  }
}

// ========== EFFECTS ==========
function spawnMatchParticles(cell,color){
  const rect=cell.getBoundingClientRect();
  const cx=rect.left+rect.width/2;
  const cy=rect.top+rect.height/2;
  for(let i=0;i<8;i++){
    const el=document.createElement('div');
    el.style.cssText=`position:fixed;left:${cx}px;top:${cy}px;width:6px;height:6px;border-radius:50%;background:${color};pointer-events:none;z-index:30;box-shadow:0 0 6px ${color}`;
    document.body.appendChild(el);
    const angle=Math.random()*Math.PI*2;
    const dist=30+Math.random()*40;
    const dx=Math.cos(angle)*dist;
    const dy=Math.sin(angle)*dist;
    el.animate([
      {transform:'translate(0,0) scale(1)',opacity:1},
      {transform:`translate(${dx}px,${dy}px) scale(0)`,opacity:0}
    ],{duration:400+Math.random()*200,easing:'ease-out'});
    setTimeout(()=>el.remove(),600);
  }
}

function spawnFloatText(r,c,text,color){
  const cell=getCell(r,c);
  if(!cell)return;
  const rect=cell.getBoundingClientRect();
  const el=document.createElement('div');
  el.className='float-text';
  el.style.left=(rect.left+rect.width/2)+'px';
  el.style.top=rect.top+'px';
  el.style.color=color||'#fff';
  el.style.fontSize=(combo>=3?'1.4em':'1em');
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),900);
}

function showCombo(n){
  const el=document.getElementById('comboDisplay');
  const colors=['','#00e5ff','#ffd700','#ff6b9d','#a855f7','#ff9100'];
  el.style.color=colors[Math.min(n,5)]||'#fff';
  el.textContent=n+'x 连击!';
  el.className='combo-display show';
  setTimeout(()=>el.className='combo-display',800);
}

// ========== HINT ==========
function showHint(){
  if(animating)return;
  // Find a valid swap
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      // Try swap right
      if(c<COLS-1){
        [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]];
        if(findMatches().length>0){
          [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]];
          const cell=getCell(r,c);
          const cell2=getCell(r,c+1);
          if(cell)cell.classList.add('hint');
          if(cell2)cell2.classList.add('hint');
          return;
        }
        [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]];
      }
      // Try swap down
      if(r<ROWS-1){
        [grid[r][c],grid[r+1][c]]=[grid[r+1][c],grid[r][c]];
        if(findMatches().length>0){
          [grid[r][c],grid[r+1][c]]=[grid[r+1][c],grid[r][c]];
          const cell=getCell(r,c);
          const cell2=getCell(r+1,c);
          if(cell)cell.classList.add('hint');
          if(cell2)cell2.classList.add('hint');
          return;
        }
        [grid[r][c],grid[r+1][c]]=[grid[r+1][c],grid[r][c]];
      }
    }
  }
}

function clearHint(){
  if(hintTimer){clearTimeout(hintTimer);hintTimer=null}
  document.querySelectorAll('.cell.hint').forEach(c=>c.classList.remove('hint'));
}

function useHint(){
  if(animating)return;
  clearHint();
  showHint();
}

// ========== SHUFFLE ==========
function useShuffle(){
  if(animating)return;
  // Shuffle all cards
  const all=[];
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      all.push(grid[r][c]);
  // Fisher-Yates
  for(let i=all.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [all[i],all[j]]=[all[j],all[i]];
  }
  let idx=0;
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      grid[r][c]=all[idx++];

  renderBoard();
  showToast('🔀 已洗牌!');

  // Check if there are valid moves, if not shuffle again
  if(!hasValidMoves()) useShuffle();
}

// ========== BOMB ==========
function useBomb(){
  if(animating)return;
  animating=true;

  // Find the most common type and remove all of it
  const counts=new Array(CARD_TYPES.length).fill(0);
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      counts[grid[r][c]]++;
  const maxType=counts.indexOf(Math.max(...counts));

  const toRemove=[];
  for(let r=0;r<ROWS;r++)
    for(let c=0;c<COLS;c++)
      if(grid[r][c]===maxType) toRemove.push({r,c});

  const bombScore=toRemove.length*15;
  score+=bombScore;

  toRemove.forEach(m=>{
    const cell=getCell(m.r,m.c);
    if(cell){
      cell.classList.add('matched');
      spawnMatchParticles(cell,CARD_COLORS[maxType]);
    }
  });
  spawnFloatText(toRemove[0].r,toRemove[0].c,'💣 +'+bombScore,'#ff9100');

  setTimeout(async()=>{
    toRemove.forEach(m=>grid[m.r][m.c]=-1);
    await applyGravity();
    await fillEmpty();
    renderBoard();
    updateHUD();

    if(score>=targetScore) levelComplete();
    animating=false;
  },400);
}

// ========== VALID MOVES CHECK ==========
function hasValidMoves(){
  for(let r=0;r<ROWS;r++){
    for(let c=0;c<COLS;c++){
      if(c<COLS-1){
        [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]];
        if(findMatches().length>0){[grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]];return true}
        [grid[r][c],grid[r][c+1]]=[grid[r][c+1],grid[r][c]];
      }
      if(r<ROWS-1){
        [grid[r][c],grid[r+1][c]]=[grid[r+1][c],grid[r][c]];
        if(findMatches().length>0){[grid[r][c],grid[r+1][c]]=[grid[r+1][c],grid[r][c]];return true}
        [grid[r][c],grid[r+1][c]]=[grid[r+1][c],grid[r][c]];
      }
    }
  }
  return false;
}

// ========== HUD ==========
function updateHUD(){
  document.getElementById('scoreVal').textContent=score;
  document.getElementById('comboVal').textContent=combo;
  document.getElementById('movesVal').textContent=moves;
  document.getElementById('levelVal').textContent=level;

  // Flash moves if low
  const movesEl=document.getElementById('movesVal');
  if(moves<=5) movesEl.style.color='#ff3e3e';
  else movesEl.style.color='';
}

// ========== LEVEL ==========
function levelComplete(){
  const stars=moves>=15?3:moves>=8?2:1;
  document.getElementById('lcStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  document.getElementById('lcStats').innerHTML=`得分: ${score} · 剩余步数: ${moves}`;
  document.getElementById('levelComplete').classList.add('show');
  // Celebration particles
  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const el=document.createElement('div');
      el.style.cssText=`position:fixed;left:${Math.random()*100}%;top:${Math.random()*50}%;font-size:${1+Math.random()*1.5}em;pointer-events:none;z-index:90`;
      el.textContent=['🎉','✨','🌟','💫','🎊'][Math.floor(Math.random()*5)];
      document.body.appendChild(el);
      el.animate([
        {transform:'translateY(0) scale(1)',opacity:1},
        {transform:`translateY(${100+Math.random()*200}px) scale(0)`,opacity:0}
      ],{duration:1500,easing:'ease-out'});
      setTimeout(()=>el.remove(),1500);
    },i*50);
  }
}

function nextLevel(){
  document.getElementById('levelComplete').classList.remove('show');
  level++;
  moves=Math.max(20,35-level*2);
  targetScore=1000+level*500;
  score=0;
  combo=0;
  selected=null;
  initGrid();
  // Make sure no initial matches and has valid moves
  while(!hasValidMoves()) initGrid();
  renderBoard();
  updateHUD();
}

function gameOver(){
  document.getElementById('goStats').innerHTML=`最终得分: ${score} · 到达关卡: ${level}`;
  document.getElementById('gameover').classList.add('show');
}

function restartGame(){
  document.getElementById('gameover').classList.remove('show');
  level=1;score=0;combo=0;moves=30;targetScore=1000;
  selected=null;
  initGrid();
  while(!hasValidMoves()) initGrid();
  renderBoard();
  updateHUD();
}

// ========== TOAST ==========
function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);border:1px solid var(--cyan);color:var(--cyan);padding:10px 20px;border-radius:10px;z-index:30;font-size:.85em;pointer-events:none';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},1200);
}

// ========== UTILITY ==========
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}

// ========== SHAKE ANIMATION ==========
const shakeStyle=document.createElement('style');
shakeStyle.textContent='@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}';
document.head.appendChild(shakeStyle);

// ========== START ==========
function startGame(){
  document.getElementById('startScreen').classList.add('hidden');
  level=1;score=0;combo=0;moves=30;targetScore=1000;
  selected=null;
  initGrid();
  while(!hasValidMoves()) initGrid();
  renderBoard();
  updateHUD();
  hintTimer=setTimeout(showHint,5000);
}

// Resize handler
window.addEventListener('resize',()=>{
  if(grid.length) renderBoard();
});
</script>
</body>
