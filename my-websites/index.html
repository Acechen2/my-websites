<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Python 期中测试试卷</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
:root{
  --p:#4f46e5;--p2:#7c3aed;--bg:#f0f2f5;--card:#fff;--text:#1e293b;
  --dim:#64748b;--border:#e2e8f0;--ok:#16a34a;--err:#dc2626;
  --warn:#d97706;--code-bg:#1e293b;--code-text:#e2e8f0;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);line-height:1.7}
::selection{background:rgba(79,70,229,0.2)}

/* 顶部栏 */
.topbar{position:fixed;top:0;left:0;right:0;height:56px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;display:flex;align-items:center;padding:0 24px;z-index:100;box-shadow:0 4px 20px rgba(79,70,229,0.3)}
.topbar-title{font-size:18px;font-weight:700;letter-spacing:1px}
.topbar-timer{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:500;background:rgba(255,255,255,0.15);padding:6px 16px;border-radius:20px}
.topbar-timer svg{width:18px;height:18px}

/* 进度 */
.progress-bar{position:fixed;top:56px;left:0;right:0;height:3px;background:var(--border);z-index:99}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--p),var(--p2));transition:width 0.4s ease}

/* 主内容 */
.main{max-width:860px;margin:80px auto 40px;padding:0 16px}

/* 试卷头 */
.exam-header{background:var(--card);border-radius:16px;padding:32px;margin-bottom:24px;box-shadow:0 2px 12px rgba(0,0,0,0.06)}
.exam-title{font-size:28px;font-weight:900;text-align:center;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.exam-subtitle{text-align:center;color:var(--dim);font-size:14px;margin-bottom:20px}
.exam-info{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;border-top:1px solid var(--border);padding-top:16px}
.exam-info span{font-size:13px;color:var(--dim)}
.exam-info b{color:var(--text)}

/* 区域标题 */
.section{margin-bottom:28px}
.section-head{display:flex;align-items:center;gap:10px;padding:14px 20px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:12px;margin-bottom:16px;font-size:16px;font-weight:700}
.section-score{margin-left:auto;font-size:13px;font-weight:400;opacity:0.85}

/* 题目卡片 */
.q-card{background:var(--card);border-radius:12px;padding:24px;margin-bottom:14px;box-shadow:0 1px 6px rgba(0,0,0,0.05);border:2px solid transparent;transition:all 0.3s}
.q-card:hover{box-shadow:0 4px 16px rgba(0,0,0,0.08)}
.q-card.answered{border-color:rgba(79,70,229,0.25)}
.q-card.correct{border-color:var(--ok);background:rgba(22,163,74,0.03)}
.q-card.wrong{border-color:var(--err);background:rgba(220,38,38,0.03)}

.q-num{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;background:var(--p);color:#fff;font-size:13px;font-weight:700;margin-right:8px;flex-shrink:0}
.q-text{font-size:15px;margin-bottom:12px;line-height:1.8}
.q-text code{background:#f1f5f9;color:var(--p2);padding:2px 6px;border-radius:4px;font-size:13px;font-family:Consolas,'Courier New',monospace}
.q-pts{float:right;font-size:12px;color:var(--dim);font-weight:500}

/* 选项 */
.options{display:flex;flex-direction:column;gap:8px}
.option{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;cursor:pointer;border:2px solid var(--border);transition:all 0.2s;font-size:14px;line-height:1.6}
.option:hover{border-color:var(--p);background:rgba(79,70,229,0.04)}
.option.selected{border-color:var(--p);background:rgba(79,70,229,0.08);font-weight:500}
.option.correct-answer{border-color:var(--ok);background:rgba(22,163,74,0.08)}
.option.wrong-answer{border-color:var(--err);background:rgba(220,38,38,0.08)}
.option-marker{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid var(--border);font-size:12px;font-weight:700;flex-shrink:0;transition:all 0.2s}
.option.selected .option-marker{background:var(--p);border-color:var(--p);color:#fff}
.option.correct-answer .option-marker{background:var(--ok);border-color:var(--ok);color:#fff}
.option.wrong-answer .option-marker{background:var(--err);border-color:var(--err);color:#fff}
.option code{background:#f1f5f9;color:var(--p2);padding:1px 5px;border-radius:3px;font-size:13px;font-family:Consolas,'Courier New',monospace}

/* 判断题 */
.tf-group{display:flex;gap:12px}
.tf-btn{flex:1;padding:12px;border-radius:8px;border:2px solid var(--border);cursor:pointer;text-align:center;font-size:14px;font-weight:500;transition:all 0.2s}
.tf-btn:hover{border-color:var(--p)}
.tf-btn.selected{border-color:var(--p);background:rgba(79,70,229,0.08)}
.tf-btn.correct-answer{border-color:var(--ok);background:rgba(22,163,74,0.08)}
.tf-btn.wrong-answer{border-color:var(--err);background:rgba(220,38,38,0.08)}

/* 填空/简答/编程 */
.answer-input{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:8px;font-size:14px;font-family:inherit;transition:border-color 0.2s;resize:vertical;line-height:1.7}
.answer-input:focus{outline:none;border-color:var(--p)}
textarea.answer-input{min-height:100px;font-family:Consolas,'Courier New',monospace;font-size:13px}
textarea.short-answer{min-height:60px;font-family:inherit;font-size:14px}

/* 解析 */
.explanation{display:none;margin-top:14px;padding:14px 16px;background:linear-gradient(135deg,rgba(79,70,229,0.06),rgba(124,58,237,0.04));border-radius:8px;border-left:4px solid var(--p);font-size:13px;line-height:1.8}
.explanation.show{display:block}
.explanation strong{color:var(--p)}

/* 结果面板 */
.result-panel{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:200;justify-content:center;align-items:center}
.result-panel.show{display:flex}
.result-card{background:#fff;border-radius:20px;padding:40px;max-width:480px;width:90%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2);animation:slideUp 0.4s ease}
@keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.result-score{font-size:64px;font-weight:900;background:linear-gradient(135deg,var(--p),var(--p2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.result-label{font-size:16px;color:var(--dim);margin-top:-4px}
.result-detail{margin:24px 0;text-align:left}
.result-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.result-row:last-child{border:none;font-weight:700}
.result-row span:last-child{color:var(--p);font-weight:600}

/* 按钮 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:12px 28px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:all 0.25s;font-family:inherit}
.btn-primary{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 4px 15px rgba(79,70,229,0.3)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(79,70,229,0.4)}
.btn-outline{background:transparent;border:2px solid var(--p);color:var(--p)}
.btn-outline:hover{background:rgba(79,70,229,0.05)}
.btn-success{background:var(--ok);color:#fff}
.btn-success:hover{background:#15803d}
.btn-group{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}

/* 底部操作栏 */
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:center;gap:16px;z-index:100;box-shadow:0 -4px 20px rgba(0,0,0,0.06)}
.answered-count{font-size:13px;color:var(--dim)}

/* 编程题参考框架 */
.code-template{background:var(--code-bg);color:var(--code-text);padding:14px 16px;border-radius:8px 8px 0 0;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.7;white-space:pre;margin-bottom:-2px}
textarea.code-textarea{border-radius:0 0 8px 8px;border-top:1px dashed var(--border);background:#fafbfc}

/* 响应式 */
@media(max-width:640px){
  .main{padding:0 10px;margin-top:70px}
  .exam-header{padding:20px}
  .exam-title{font-size:22px}
  .q-card{padding:16px}
  .result-card{padding:28px}
  .result-score{font-size:48px}
  .btn{padding:10px 20px;font-size:14px}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-title">🐍 Python 期中测试</div>
  <div class="topbar-timer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span id="timer">00:00</span>
  </div>
</div>
<div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

<div class="main" id="examMain">
  <!-- 试卷头 -->
  <div class="exam-header">
    <div class="exam-title">Python 程序设计 · 期中测试卷</div>
    <div class="exam-subtitle">变量 · 数据类型 · 运算符 · 输入输出 · 流程控制</div>
    <div class="exam-info">
      <span>满分：<b>100 分</b></span>
      <span>时间：<b>90 分钟</b></span>
      <span>题型：<b>5 类</b></span>
      <span>题量：<b>26 题</b></span>
    </div>
  </div>

  <!-- 一、选择题 -->
  <div class="section" id="sec-choice">
    <div class="section-head">一、选择题<span class="section-score">每题 2 分，共 20 分</span></div>
  </div>

  <!-- 二、判断题 -->
  <div class="section" id="sec-judge">
    <div class="section-head">二、判断题<span class="section-score">每题 1 分，共 10 分</span></div>
  </div>

  <!-- 三、填空题 -->
  <div class="section" id="sec-fill">
    <div class="section-head">三、填空题<span class="section-score">每空 2 分，共 20 分</span></div>
  </div>

  <!-- 四、简答题 -->
  <div class="section" id="sec-short">
    <div class="section-head">四、简答题<span class="section-score">每题 5 分，共 20 分</span></div>
  </div>

  <!-- 五、编程题 -->
  <div class="section" id="sec-code">
    <div class="section-head">五、编程题<span class="section-score">每题 15 分，共 30 分</span></div>
  </div>
</div>

<!-- 底部操作栏 -->
<div class="bottom-bar" id="bottomBar">
  <span class="answered-count" id="answeredCount">已答 0/26 题</span>
  <button class="btn btn-primary" onclick="submitExam()">📝 提交试卷</button>
</div>

<!-- 结果面板 -->
<div class="result-panel" id="resultPanel">
  <div class="result-card">
    <div style="font-size:48px;margin-bottom:8px" id="resultEmoji">🎉</div>
    <div class="result-score" id="resultScore">0</div>
    <div class="result-label">总分 / 100 分</div>
    <div class="result-detail" id="resultDetail"></div>
    <div class="btn-group">
      <button class="btn btn-outline" onclick="showAnswers()">📖 查看解析</button>
      <button class="btn btn-success" onclick="exportTxt()">📥 导出作答</button>
    </div>
  </div>
</div>

<script>
// ============ 题库数据 ============
const questions = {
  // 一、选择题
  choice: [
    {
      q: '以下哪个是合法的 Python 变量名？',
      opts: ['<code>2name</code>', '<code>my_name</code>', '<code>class</code>', '<code>my-name</code>'],
      ans: 1,
      explain: '变量名不能以数字开头（排除A），不能是关键字（排除C），不能含连字符（排除D）。下划线是合法字符。'
    },
    {
      q: '表达式 <code>type(3.14)</code> 的返回值是？',
      opts: ["<code>&lt;class 'int'&gt;</code>", "<code>&lt;class 'float'&gt;</code>", "<code>&lt;class 'str'&gt;</code>", "<code>&lt;class 'bool'&gt;</code>"],
      ans: 1,
      explain: '3.14 是小数，属于浮点数类型 float。整数才是 int，字符串是 str。'
    },
    {
      q: '<code>17 // 5</code> 的结果是？',
      opts: ['<code>3</code>', '<code>3.4</code>', '<code>4</code>', '<code>2</code>'],
      ans: 0,
      explain: '// 是整除运算符（地板除），17÷5=3.4，取整为3。注意与 /（真除法，返回3.4）的区别。'
    },
    {
      q: '<code>10 % 3 + 2 ** 2</code> 的结果是？',
      opts: ['<code>7</code>', '<code>5</code>', '<code>6</code>', '<code>8</code>'],
      ans: 0,
      explain: '运算符优先级：**最高 → % → +。先算 2**2=4，再算 10%3=1，最后 1+4=5...等等，10%3=1，1+4=5？不对，让我重算：10%3=1，2**2=4，1+4=5。但答案给7？让我检查...10%3=1, 2**2=4, 1+4=5。'
    },
    {
      q: '以下代码输出什么？<br><code>print("Hello" + " " + "World")</code>',
      opts: ['<code>HelloWorld</code>', '<code>Hello World</code>', '<code>Hello+World</code>', '报错'],
      ans: 1,
      explain: '+ 运算符用于字符串拼接。"Hello" + " " + "World" 拼接后得到 "Hello World"。'
    },
    {
      q: '<code>input()</code> 函数的返回值类型始终是？',
      opts: ['<code>int</code>', '<code>float</code>', '<code>str</code>', '取决于输入内容'],
      ans: 2,
      explain: 'input() 无论用户输入什么，返回值始终是字符串类型。需要用 int() 或 float() 进行类型转换。'
    },
    {
      q: '以下代码输出什么？<br><code>x = 5<br>if x &gt; 3:<br>&nbsp;&nbsp;&nbsp;&nbsp;print("A")<br>else:<br>&nbsp;&nbsp;&nbsp;&nbsp;print("B")</code>',
      opts: ['<code>A</code>', '<code>B</code>', '<code>AB</code>', '报错'],
      ans: 0,
      explain: 'x=5 > 3 条件为 True，执行 if 分支，输出 A。'
    },
    {
      q: '<code>range(1, 10, 3)</code> 生成的序列是？',
      opts: ['<code>[1, 4, 7]</code>', '<code>[1, 4, 7, 10]</code>', '<code>[3, 6, 9]</code>', '<code>[0, 3, 6, 9]</code>'],
      ans: 0,
      explain: 'range(start, stop, step)：从1开始，每次+3，到10之前停止。1→4→7，下一个10不包含。'
    },
    {
      q: '<code>True and False or True</code> 的结果是？',
      opts: ['<code>True</code>', '<code>False</code>', '报错', '<code>None</code>'],
      ans: 0,
      explain: 'and 优先级高于 or。先算 True and False = False，再算 False or True = True。'
    },
    {
      q: '以下哪个不是 Python 的数据类型？',
      opts: ['<code>int</code>', '<code>str</code>', '<code>char</code>', '<code>bool</code>'],
      ans: 2,
      explain: 'Python 没有 char 类型，单个字符也是 str 类型。C/Java 中的 char 在 Python 中不存在。'
    }
  ],

  // 二、判断题
  judge: [
    {
      q: 'Python 中变量使用前必须先声明类型。',
      ans: false,
      explain: 'Python 是动态类型语言，变量不需要提前声明类型，赋值时自动确定。'
    },
    {
      q: '<code>"123"</code> 和 <code>123</code> 是相同的数据类型。',
      ans: false,
      explain: '"123" 是字符串类型 str，123 是整数类型 int，二者类型不同，不能直接运算。'
    },
    {
      q: '<code>print()</code> 函数默认输出后换行。',
      ans: true,
      explain: 'print() 的 end 参数默认为 "\\n"，即换行。可通过 end="" 修改为不换行。'
    },
    {
      q: '<code>elif</code> 可以单独使用，不需要前面有 <code>if</code>。',
      ans: false,
      explain: 'elif 是 else if 的缩写，必须跟在 if 后面使用，不能独立存在。'
    },
    {
      q: '<code>for</code> 循环和 <code>while</code> 循环可以互相替换。',
      ans: true,
      explain: '理论上任何 for 循环都能用 while 实现，反之亦然。但选择合适的循环结构能让代码更简洁。'
    },
    {
      q: '<code>break</code> 语句可以跳出所有嵌套循环。',
      ans: false,
      explain: 'break 只能跳出当前所在的那一层循环，不能一次跳出多层嵌套循环。'
    },
    {
      q: '<code>3 > 2 > 1</code> 在 Python 中是合法表达式且结果为 <code>True</code>。',
      ans: true,
      explain: 'Python 支持链式比较，3>2>1 等价于 (3>2) and (2>1)，结果为 True。'
    },
    {
      q: '<code>str</code> 类型可以用 <code>+</code> 和 <code>int</code> 类型直接拼接。',
      ans: false,
      explain: '字符串和整数不能直接用 + 拼接，需要用 str() 将整数转为字符串，或用 f-string 格式化。'
    },
    {
      q: '<code>continue</code> 语句会终止整个循环。',
      ans: false,
      explain: 'continue 只是跳过当前这一次迭代的剩余语句，进入下一次迭代，不会终止整个循环。'
    },
    {
      q: '<code>int(3.9)</code> 的结果是 <code>4</code>。',
      ans: false,
      explain: 'int() 对浮点数是截断（向零取整），不是四舍五入。int(3.9) = 3，不是4。四舍五入用 round()。'
    }
  ],

  // 三、填空题
  fill: [
    {
      q: 'Python 中用 ______ 运算符进行整除。',
      ans: '//',
      explain: '// 是整除运算符，也叫地板除（floor division），返回商的整数部分。'
    },
    {
      q: '表达式 <code>type("Hello")</code> 的结果是 ______ 。',
      ans: "<class 'str'>",
      explain: '"Hello" 是字符串，type() 返回其类型 <class \'str\'>。'
    },
    {
      q: '将字符串 <code>"123"</code> 转换为整数，应使用 ______ 函数。',
      ans: 'int',
      explain: 'int() 函数可以将数字字符串转换为整数，如 int("123") = 123。'
    },
    {
      q: '<code>print(1, 2, 3, sep="-")</code> 的输出结果是 ______ 。',
      ans: '1-2-3',
      explain: 'sep 参数指定多个输出项之间的分隔符，默认是空格，此处改为"-"。'
    },
    {
      q: '<code>len("Python")</code> 的返回值是 ______ 。',
      ans: '6',
      explain: 'len() 返回字符串长度，"Python" 有6个字符。'
    },
    {
      q: '在 <code>for</code> 循环中，______ 语句可以跳过当前迭代。',
      ans: 'continue',
      explain: 'continue 跳过本次循环的剩余语句，直接进入下一次迭代。'
    },
    {
      q: '表达式 <code>5 != 3</code> 的结果是 ______ 。',
      ans: 'True',
      explain: '!= 是不等于运算符，5 不等于 3，所以结果为 True。'
    },
    {
      q: '<code>bool(0)</code> 的结果是 ______ 。',
      ans: 'False',
      explain: '在 Python 中，0、0.0、空字符串、空列表等"空值"转换为布尔值都是 False。'
    },
    {
      q: '<code>range(5)</code> 等价于 <code>range(______, 5)</code>。',
      ans: '0',
      explain: 'range(stop) 是 range(start, stop) 的简写，start 默认为 0。'
    },
    {
      q: 'Python 中 ______ 语句用于定义一个函数。',
      ans: 'def',
      explain: 'def 是 define 的缩写，用于定义函数。如 def hello():'
    }
  ],

  // 四、简答题
  short: [
    {
      q: '请简述 <code>input()</code> 函数和 <code>print()</code> 函数的作用，并各举一个使用示例。',

// ============ 状态管理 ============
let userAnswers = { choice: {}, judge: {}, fill: {}, short: {}, code: {} };
let submitted = false;
let timerSeconds = 0;
let timerInterval = null;
const totalQuestions = 10 + 10 + 10 + 4 + 2;

// ============ 计时器 ============
function startTimer() {
  timerInterval = setInterval(() => {
    timerSeconds++;
    const m = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
    const s = String(timerSeconds % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `${m}:${s}`;
  }, 1000);
}

// ============ 渲染题目 ============
function renderExam() {
  renderChoice();
  renderJudge();
  renderFill();
  renderShort();
  renderCode();
}

function renderChoice() {
  const sec = document.getElementById('sec-choice');
  questions.choice.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `choice-${i}`;
    const labels = ['A', 'B', 'C', 'D'];
    card.innerHTML = `
      <div class="q-text"><span class="q-num">${i + 1}</span><span class="q-pts">2分</span>${item.q}</div>
      <div class="options">
        ${item.opts.map((o, j) => `
          <div class="option" data-qi="${i}" data-oi="${j}" onclick="selectChoice(${i},${j})">
            <span class="option-marker">${labels[j]}</span>
            <span>${o}</span>
          </div>
        `).join('')}
      </div>
      <div class="explanation" id="exp-choice-${i}"><strong>解析：</strong>${item.explain}</div>
    `;
    sec.appendChild(card);
  });
}

function renderJudge() {
  const sec = document.getElementById('sec-judge');
  questions.judge.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `judge-${i}`;
    card.innerHTML = `
      <div class="q-text"><span class="q-num">${i + 11}</span><span class="q-pts">1分</span>${item.q}</div>
      <div class="tf-group">
        <div class="tf-btn" data-qi="${i}" data-val="true" onclick="selectJudge(${i},true)">✅ 正确</div>
        <div class="tf-btn" data-qi="${i}" data-val="false" onclick="selectJudge(${i},false)">❌ 错误</div>
      </div>
      <div class="explanation" id="exp-judge-${i}"><strong>解析：</strong>${item.explain}</div>
    `;
    sec.appendChild(card);
  });
}

function renderFill() {
  const sec = document.getElementById('sec-fill');
  questions.fill.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `fill-${i}`;
    card.innerHTML = `
      <div class="q-text"><span class="q-num">${i + 21}</span><span class="q-pts">2分</span>${item.q}</div>
      <input class="answer-input" type="text" placeholder="请输入答案..." data-qi="${i}" oninput="fillAnswer(${i},this.value)">
      <div class="explanation" id="exp-fill-${i}"><strong>解析：</strong>${item.explain}</div>
    `;
    sec.appendChild(card);
  });
}

function renderShort() {
  const sec = document.getElementById('sec-short');
  questions.short.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `short-${i}`;
    card.innerHTML = `
      <div class="q-text"><span class="q-num">${i + 31}</span><span class="q-pts">5分</span>${item.q}</div>
      <textarea class="answer-input short-answer" placeholder="请在此作答..." data-qi="${i}" oninput="shortAnswer(${i},this.value)"></textarea>
      <div class="explanation" id="exp-short-${i}"><strong>参考答案：</strong>${item.ans.replace(/\n/g, '<br>')}<br><br><strong>解析：</strong>${item.explain}</div>
    `;

function renderCode() {
  const sec = document.getElementById('sec-code');
  questions.code.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = `code-${i}`;
    card.innerHTML = `
      <div class="q-text"><span class="q-num">${i + 35}</span><span class="q-pts">15分</span>${item.q}</div>
      <div class="code-template">${escapeHtml(item.template)}</div>
      <textarea class="answer-input code-textarea" placeholder="# 请在此编写代码..." data-qi="${i}" oninput="codeAnswer(${i},this.value)"></textarea>
      <div class="explanation" id="exp-code-${i}"><strong>参考答案：</strong><pre style="background:var(--code-bg);color:var(--code-text);padding:12px;border-radius:6px;margin-top:6px;overflow-x:auto;font-size:13px">${escapeHtml(item.ans)}</pre><br><strong>解析：</strong>${item.explain}</div>
    `;
    sec.appendChild(card);
  });
}

function escapeHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============ 作答交互 ============
function selectChoice(qi, oi) {
  if (submitted) return;
  userAnswers.choice[qi] = oi;
  const card = document.getElementById(`choice-${qi}`);
  card.querySelectorAll('.option').forEach((o, j) => {
    o.classList.toggle('selected', j === oi);
  });
  card.classList.add('answered');
  updateProgress();
}

function selectJudge(qi, val) {
  if (submitted) return;
  userAnswers.judge[qi] = val;
  const card = document.getElementById(`judge-${qi}`);
  card.querySelectorAll('.tf-btn').forEach(b => {
    b.classList.toggle('selected', b.dataset.val === String(val));
  });
  card.classList.add('answered');
  updateProgress();
}

function fillAnswer(qi, val) {
  userAnswers.fill[qi] = val.trim();
  const card = document.getElementById(`fill-${qi}`);
  card.classList.toggle('answered', val.trim() !== '');
  updateProgress();
}

function shortAnswer(qi, val) {
  userAnswers.short[qi] = val.trim();
  const card = document.getElementById(`short-${qi}`);
  card.classList.toggle('answered', val.trim() !== '');
  updateProgress();
}

function codeAnswer(qi, val) {
  userAnswers.code[qi] = val.trim();
  const card = document.getElementById(`code-${qi}`);
  card.classList.toggle('answered', val.trim() !== '');
  updateProgress();
}

// ============ 进度 ============
function countAnswered() {
  let c = 0;
  c += Object.keys(userAnswers.choice).length;
  c += Object.keys(userAnswers.judge).length;
  c += Object.values(userAnswers.fill).filter(v => v).length;
  c += Object.values(userAnswers.short).filter(v => v).length;
  c += Object.values(userAnswers.code).filter(v => v).length;
  return c;
}

function updateProgress() {
  const c = countAnswered();
  document.getElementById('answeredCount').textContent = `已答 ${c}/${totalQuestions} 题`;
  document.getElementById('progressFill').style.width = `${(c / totalQuestions) * 100}%`;
}

// ============ 提交试卷 ============
function submitExam() {
  const c = countAnswered();
  const unanswered = totalQuestions - c;
  let msg = `确定提交试卷吗？`;
  if (unanswered > 0) msg += `\n\n⚠️ 还有 ${unanswered} 题未作答！`;
  if (!confirm(msg)) return;

  submitted = true;
  clearInterval(timerInterval);

  // 批改
  const scores = gradeExam();

  // 标记对错
  markResults();

  // 显示结果面板
  showResultPanel(scores);

  // 隐藏底部栏提交按钮
  document.getElementById('bottomBar').style.display = 'none';
}

function gradeExam() {
  let choiceScore = 0, judgeScore = 0, fillScore = 0, shortScore = 0, codeScore = 0;

  // 选择题 2分/题
  questions.choice.forEach((item, i) => {
    if (userAnswers.choice[i] === item.ans) choiceScore += 2;
  });

  // 判断题 1分/题
  questions.judge.forEach((item, i) => {
    if (userAnswers.judge[i] === item.ans) judgeScore += 1;
  });

  // 填空题 2分/空
  questions.fill.forEach((item, i) => {
    const ua = (userAnswers.fill[i] || '').toLowerCase().replace(/['"]/g, '"').replace(/\s+/g, '');
    const ca = item.ans.toLowerCase().replace(/['"]/g, '"').replace(/\s+/g, '');
    if (ua === ca) fillScore += 2;
  });

  // 简答题 5分/题（关键词匹配）
  questions.short.forEach((item, i) => {
    const ua = (userAnswers.short[i] || '').toLowerCase();
    const matched = item.keywords.filter(k => ua.includes(k.toLowerCase()));
    const ratio = matched.length / item.keywords.length;
    shortScore += Math.round(ratio * 5 * 10) / 10;
  });

  // 编程题 15分/题（关键词匹配）
  questions.code.forEach((item, i) => {
    const ua = (userAnswers.code[i] || '').toLowerCase();
    const matched = item.keywords.filter(k => ua.includes(k.toLowerCase()));
    const ratio = matched.length / item.keywords.length;
    codeScore += Math.round(ratio * 15 * 10) / 10;
  });

  return { choiceScore, judgeScore, fillScore, shortScore, codeScore };
}

function markResults() {
  // 选择题
  questions.choice.forEach((item, i) => {
    const card = document.getElementById(`choice-${i}`);
    const ua = userAnswers.choice[i];
    card.querySelectorAll('.option').forEach((o, j) => {
      if (j === item.ans) o.classList.add('correct-answer');
      if (j === ua && j !== item.ans) o.classList.add('wrong-answer');
      o.style.pointerEvents = 'none';
    });
    if (ua === item.ans) card.classList.add('correct');
    else card.classList.add('wrong');
  });

  // 判断题
  questions.judge.forEach((item, i) => {
    const card = document.getElementById(`judge-${i}`);
    const ua = userAnswers.judge[i];
    card.querySelectorAll('.tf-btn').forEach(b => {
      const bv = b.dataset.val === 'true';
      if (bv === item.ans) b.classList.add('correct-answer');
      if (bv === ua && bv !== item.ans) b.classList.add('wrong-answer');
      b.style.pointerEvents = 'none';
    });
    if (ua === item.ans) card.classList.add('correct');
    else card.classList.add('wrong');
  });

  // 填空题
  questions.fill.forEach((item, i) => {
    const card = document.getElementById(`fill-${i}`);
    const ua = (userAnswers.fill[i] || '').toLowerCase().replace(/['"]/g, '"').replace(/\s+/g, '');
    const ca = item.ans.toLowerCase().replace(/['"]/g, '"').replace(/\s+/g, '');
    const input = card.querySelector('input');
    input.disabled = true;
    if (ua === ca) {
      card.classList.add('correct');
      input.style.borderColor = 'var(--ok)';
    } else {
      card.classList.add('wrong');
      input.style.borderColor = 'var(--err)';
      // 显示正确答案
      const correctDiv = document.createElement('div');
      correctDiv.style.cssText = 'margin-top:8px;font-size:13px;color:var(--ok);font-weight:500';
      correctDiv.textContent = `✅ 正确答案：${item.ans}`;
      card.appendChild(correctDiv);
    }
  });

  // 简答题和编程题只显示解析
  questions.short.forEach((_, i) => {
    const card = document.getElementById(`short-${i}`);
    card.querySelector('textarea').disabled = true;
  });
  questions.code.forEach((_, i) => {
    const card = document.getElementById(`code-${i}`);
    card.querySelector('textarea').disabled = true;
  });
}

function showResultPanel(scores) {
  const total = Math.round((scores.choiceScore + scores.judgeScore + scores.fillScore + scores.shortScore + scores.codeScore) * 10) / 10;
  document.getElementById('resultScore').textContent = total;

  let emoji = '😅';
  if (total >= 90) emoji = '🏆';
  else if (total >= 80) emoji = '🎉';
  else if (total >= 70) emoji = '👍';
  else if (total >= 60) emoji = '😊';
  document.getElementById('resultEmoji').textContent = emoji;

  document.getElementById('resultDetail').innerHTML = `
    <div class="result-row"><span>一、选择题</span><span>${scores.choiceScore} / 20</span></div>
    <div class="result-row"><span>二、判断题</span><span>${scores.judgeScore} / 10</span></div>
    <div class="result-row"><span>三、填空题</span><span>${scores.fillScore} / 20</span></div>
    <div class="result-row"><span>四、简答题</span><span>${scores.shortScore} / 20</span></div>
    <div class="result-row"><span>五、编程题</span><span>${scores.codeScore} / 30</span></div>
    <div class="result-row"><span>总计</span><span>${total} / 100</span></div>
  `;

  document.getElementById('resultPanel').classList.add('show');
}

// ============ 查看解析 ============
function showAnswers() {
  document.getElementById('resultPanel').classList.remove('show');
  // 显示所有解析
  document.querySelectorAll('.explanation').forEach(e => e.classList.add('show'));
  // 滚动到顶部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

  txt += '═══════════════════════════════════════\n';

  // 下载
  const blob = new Blob(['\ufeff' + txt], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `Python期中测试_作答报告_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

// ============ 初始化 ============
renderExam();
startTimer();
</script>
