<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>网页设计交互式自学课件 - 产品展示页项目</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap');
:root {
  --primary: #667eea;
  --primary-dark: #764ba2;
  --bg: #0a0a1a;
  --bg2: #0f0f2a;
  --card: #14143a;
  --card2: #1a1a44;
  --text: #e8e8f0;
  --text-dim: #7878a0;
  --border: #2a2a5a;
  --code-bg: #0d0d24;
  --success: #4caf50;
  --tag-html: #ff6b6b;
  --tag-attr: #51cf66;
  --tag-val: #ffd43b;
  --css-sel: #74c0fc;
  --css-prop: #da77f2;
  --css-val: #ffa94d;
  --comment: #555580;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; overflow: hidden; }
body {
  font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}

/* ===== 顶部栏 ===== */
.topbar {
  height: 56px;
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  display: flex;
  align-items: center;
  padding: 0 24px;
  position: relative;
  z-index: 100;
  box-shadow: 0 4px 30px rgba(102,126,234,0.3);
}
.topbar-title {
  font-size: 18px;
  font-weight: 700;
  letter-spacing: 1px;
  color: #fff;
}
.topbar-step {
  margin-left: auto;
  font-size: 14px;
  color: rgba(255,255,255,0.8);
  font-weight: 500;
}

/* ===== 进度条 ===== */
.progress-wrap {
  height: 4px;
  background: var(--bg2);
  position: relative;
  z-index: 99;
}
.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--primary), #f093fb);
  transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
  border-radius: 0 2px 2px 0;
  box-shadow: 0 0 12px rgba(102,126,234,0.5);
}

/* ===== 主体布局 ===== */
.app {
  display: flex;
  height: calc(100vh - 60px);
  overflow: hidden;
}

/* ===== 侧边栏 ===== */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
  transition: transform 0.3s;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
.step-item {
  padding: 14px 20px;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: all 0.25s;
  border-left: 3px solid transparent;
  font-size: 14px;
  color: var(--text-dim);
}
.step-item:hover {
  background: rgba(102,126,234,0.08);
  color: var(--text);
}
.step-item.active {
  background: rgba(102,126,234,0.12);
  color: #fff;
  border-left-color: var(--primary);
}
.step-item.completed {
  color: var(--success);
}
.step-num {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 700;
  background: var(--card);
  border: 2px solid var(--border);
  flex-shrink: 0;
  transition: all 0.3s;
}
.step-item.active .step-num {
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 0 12px rgba(102,126,234,0.4);
}
.step-item.completed .step-num {
  background: var(--success);
  border-color: var(--success);
  color: #fff;
}
.step-label { line-height: 1.3; }

/* ===== 主内容区 ===== */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.content-area {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ===== 左面板：说明+代码 ===== */
.left-panel {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
  border-right: 1px solid var(--border);
}
.panel-tabs {
  display: flex;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
}
.panel-tab {
  padding: 10px 20px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  border-bottom: 2px solid transparent;
  transition: all 0.2s;
}
.panel-tab:hover { color: var(--text); }
.panel-tab.active {
  color: var(--primary);
  border-bottom-color: var(--primary);
}
.panel-content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}
.panel-content::-webkit-scrollbar { width: 6px; }
.panel-content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* 说明区 */
.step-title {
  font-size: 22px;
  font-weight: 700;
  margin-bottom: 12px;
  background: linear-gradient(135deg, var(--primary), #f093fb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.step-desc {
  font-size: 14px;
  color: var(--text-dim);
  line-height: 1.8;
  margin-bottom: 20px;
}
.knowledge-box {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px 20px;
  margin-bottom: 20px;
}
.knowledge-title {
  font-size: 14px;
  font-weight: 700;
  color: var(--primary);
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.knowledge-list {
  list-style: none;
  padding: 0;
}
.knowledge-list li {
  font-size: 13px;
  color: var(--text-dim);
  padding: 5px 0 5px 20px;
  position: relative;
  line-height: 1.6;
}
.knowledge-list li::before {
  content: '✦';
  position: absolute;
  left: 0;
  color: var(--primary);
  font-size: 10px;
  top: 7px;
}

/* 代码区 */
.code-container {
  background: var(--code-bg);
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--border);
  position: relative;
}
.code-header {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  background: rgba(102,126,234,0.08);
  border-bottom: 1px solid var(--border);
  gap: 8px;
}
.code-dot {
  width: 10px; height: 10px; border-radius: 50%;
}
.code-dot:nth-child(1) { background: #ff5f57; }
.code-dot:nth-child(2) { background: #febc2e; }
.code-dot:nth-child(3) { background: #28c840; }
.code-filename {
  margin-left: 8px;
  font-size: 12px;
  color: var(--text-dim);
  font-family: monospace;
}
.code-lock {
  margin-left: auto;
  font-size: 11px;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 4px;
}
.code-body {
  padding: 16px;
  overflow-x: auto;
  overflow-y: auto;
  max-height: 500px;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  position: relative;
}
.code-body::-webkit-scrollbar { width: 6px; height: 6px; }
.code-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.code-body pre {
  margin: 0;
  font-family: 'Consolas', 'Fira Code', 'Courier New', monospace;
  font-size: 13px;
  line-height: 1.7;
  white-space: pre;
  tab-size: 2;
}
.code-overlay {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 10;
  cursor: default;
}
.copy-warning {
  display: none;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(255,80,80,0.95);
  color: #fff;
  padding: 10px 24px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  z-index: 20;
  pointer-events: none;
  animation: warnFade 1.5s forwards;
}
@keyframes warnFade {
  0% { opacity: 0; transform: translate(-50%,-50%) scale(0.8); }
  20% { opacity: 1; transform: translate(-50%,-50%) scale(1.05); }
  30% { transform: translate(-50%,-50%) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; }
}

/* ===== 右面板：预览 ===== */
.right-panel {
  width: 45%;
  min-width: 320px;
  display: flex;
  flex-direction: column;
}
.preview-header {
  padding: 10px 16px;
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-dim);
  display: flex;
  align-items: center;
  gap: 6px;
}
.preview-frame {
  flex: 1;
  border: none;
  background: #fff;
  width: 100%;
}

/* ===== 底部导航 ===== */
.nav-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  background: var(--bg2);
  border-top: 1px solid var(--border);
}
.nav-btn {
  padding: 10px 24px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.25s;
  font-family: inherit;
}
.nav-btn.prev {
  background: var(--card);
  color: var(--text-dim);
  border: 1px solid var(--border);
}
.nav-btn.prev:hover { background: var(--card2); color: var(--text); }
.nav-btn.next {
  background: linear-gradient(135deg, var(--primary), var(--primary-dark));
  color: #fff;
  box-shadow: 0 4px 15px rgba(102,126,234,0.3);
}
.nav-btn.next:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(102,126,234,0.4);
}
.nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  transform: none !important;
  box-shadow: none !important;
}
.nav-center {
  font-size: 13px;
  color: var(--text-dim);
}

/* ===== 完成页特效 ===== */
.complete-badge {
  width: 100px; height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--primary), #f093fb);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
  margin: 0 auto 20px;
  box-shadow: 0 0 40px rgba(102,126,234,0.4);
  animation: badgePulse 2s infinite;
}
@keyframes badgePulse {
  0%, 100% { box-shadow: 0 0 40px rgba(102,126,234,0.4); }
  50% { box-shadow: 0 0 60px rgba(102,126,234,0.6); }
}
.confetti-canvas {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 9999;
}

/* ===== 移动端切换按钮 ===== */
.mobile-toggle {
  display: none;
  position: fixed;
  bottom: 70px;
  right: 16px;
  z-index: 200;
  width: 48px; height: 48px;
  border-radius: 50%;
  background: var(--primary);
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  box-shadow: 0 4px 20px rgba(102,126,234,0.5);
}

/* ===== 响应式 ===== */
@media (max-width: 900px) {
  .sidebar { display: none; }
  .right-panel {
    position: fixed;
    top: 60px; left: 0; right: 0; bottom: 52px;
    width: 100%;
    z-index: 50;
    display: none;
  }
  .right-panel.show { display: flex; }
  .left-panel { border-right: none; }
  .mobile-toggle { display: flex; align-items: center; justify-content: center; }
  .content-area { flex-direction: column; }
  .left-panel { width: 100%; }
}
@media (max-width: 600px) {
  .topbar { padding: 0 12px; }
  .topbar-title { font-size: 15px; }
  .panel-content { padding: 16px; }
  .step-title { font-size: 18px; }
  .code-body pre { font-size: 11px; }
}

/* ===== 语法高亮色 ===== */
.hl-tag { color: #ff6b6b; }
.hl-attr { color: #51cf66; }
.hl-val { color: #ffd43b; }
.hl-sel { color: #74c0fc; }
.hl-prop { color: #da77f2; }
.hl-pval { color: #ffa94d; }
.hl-cmt { color: #555580; font-style: italic; }
.hl-punc { color: #8888aa; }
.hl-kw { color: #c792ea; }
.hl-num { color: #f78c6c; }
</style>
</head>

<body>

// ===== 构建预览用的完整HTML =====
function buildPreviewHtml(stepIndex) {
  if (stepIndex === 0) return fullProjectCode;
  const step = stepData[stepIndex];
  if (step.css && step.body) {
    return `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaWatch 智能手表</title>
<style>${step.css}</style>
</head>
<body>${step.body}</body>
</html>`;
  }
  return fullProjectCode;
}

// ===== 语法高亮 =====
function highlightCode(code) {
  let html = code
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // 注释
  html = html.replace(/(\/\*[\s\S]*?\*\/)/g, '<span class="hl-cmt">$1</span>');
  html = html.replace(/(\/\/[^\n]*)/g, '<span class="hl-cmt">$1</span>');

  // HTML 标签
  html = html.replace(/(&lt;\/?)([\w-]+)/g, '$1<span class="hl-tag">$2</span>');

  // HTML 属性
  html = html.replace(/\s([\w-]+)(=)/g, ' <span class="hl-attr">$1</span>$2');

  // 属性值
  html = html.replace(/(=)(&quot;|")(.*?)(&quot;|")/g, '$1<span class="hl-val">"$3"</span>');

  // CSS 选择器 (简化)
  html = html.replace(/^([.#][\w-]+)/gm, '<span class="hl-sel">$1</span>');

  // CSS 属性 (简化)
  html = html.replace(/^\s+([\w-]+)\s*:/gm, ' <span class="hl-prop">$1</span>:');

  // 数字
  html = html.replace(/\b(\d+\.?\d*)(px|em|rem|%|s|ms|deg|vh|vw)?\b/g, '<span class="hl-num">$1$2</span>');

  // 关键字
  html = html.replace(/\b(display|flex|position|background|color|padding|margin|font|width|height|border|text|overflow|cursor|opacity|z-index|gap|transition|animation|transform|box-shadow|content|top|left|right|bottom|min-height|max-width)\b/g, '<span class="hl-kw">$1</span>');

  return html;
}

// ===== 状态 =====
let currentStep = 0;
let completedSteps = new Set();
let currentTab = 'explain';

// ===== 渲染侧边栏 =====
function renderSidebar() {
  const sb = document.getElementById('sidebar');
  sb.innerHTML = stepData.map((s, i) => {
    let cls = '';
    if (i === currentStep) cls = 'active';
    else if (completedSteps.has(i)) cls = 'completed';
    const num = completedSteps.has(i) ? '✓' : i;
    return `<div class="step-item ${cls}" onclick="goToStep(${i})">
      <div class="step-num">${num}</div>
      <div class="step-label">${s.title}</div>
    </div>`;
  }).join('');
}

// ===== 渲染步骤内容 =====
function renderStep() {
  const step = stepData[currentStep];
  const panel = document.getElementById('panelContent');

  // 更新顶部状态
  document.getElementById('topStep').textContent = `步骤 ${currentStep}/6`;
  document.getElementById('progressFill').style.width = `${(currentStep / 6) * 100}%`;
  document.getElementById('navCenter').textContent = `${currentStep} / 6`;

  // 导航按钮状态
  document.getElementById('btnPrev').disabled = currentStep === 0;
  document.getElementById('btnNext').textContent = currentStep === 6 ? '🎉 已完成' : '下一步 →';
  document.getElementById('btnNext').disabled = currentStep === 6;

  // 完成页
  if (step.isComplete) {
    completedSteps.add(currentStep - 1);
    renderSidebar();
    panel.innerHTML = `
      <div style="text-align:center;padding:20px 0">
        <div class="complete-badge">🏆</div>
        <div class="step-title" style="text-align:center">项目完成！</div>
        <p style="color:var(--text-dim);margin-bottom:30px;font-size:15px">${step.desc}</p>
        <div class="knowledge-box">
          <div class="knowledge-title">💡 进阶挑战</div>
          <ul class="knowledge-list">
            ${step.points.map(p => `<li>${p}</li>`).join('')}
          </ul>
        </div>
      </div>
      <div class="code-container" style="margin-top:10px">
        <div class="code-header">
          <span class="code-dot"></span>
          <span class="code-dot"></span>
          <span class="code-dot"></span>
          <span class="code-filename">index.html — 完整代码</span>
          <span class="code-lock">🔒 只读模式</span>
        </div>
        <div class="code-body" id="codeBody">
          <div class="code-overlay" id="codeOverlay"></div>
          <pre id="codePre"></pre>
          <div class="copy-warning" id="copyWarning">⚠️ 代码仅供学习查看，不可复制</div>
        </div>
      </div>
    `;
    document.getElementById('codePre').innerHTML = highlightCode(fullProjectCode);
    document.getElementById('progressFill').style.width = '100%';
    document.getElementById('topStep').textContent = '已完成！';
    launchConfetti();
    switchTab('explain');
    updatePreview();
    return;
  }

  // 普通步骤页
  completedSteps.add(currentStep > 0 ? currentStep - 1 : 0);
  renderSidebar();

  const explainHtml = `
    <div class="step-title">${step.title}</div>
    <div class="step-desc">${step.desc}</div>
    <div class="knowledge-box">
      <div class="knowledge-title">📝 知识要点</div>
      <ul class="knowledge-list">
        ${step.points.map(p => `<li>${p}</li>`).join('')}
      </ul>
    </div>
  `;

  const codeHtml = `
    <div class="step-title" style="font-size:18px">${step.title} — 新增代码</div>
    <div class="step-desc" style="margin-bottom:16px">以下是本步骤新增的代码，高亮部分为关键内容：</div>
    <div class="code-container">
      <div class="code-header">
        <span class="code-dot"></span>
        <span class="code-dot"></span>
        <span class="code-dot"></span>
        <span class="code-filename">${currentStep <= 1 ? 'index.html + style.css' : 'style.css'}</span>
        <span class="code-lock">🔒 只读</span>
      </div>
      <div class="code-body" id="codeBody">
        <div class="code-overlay" id="codeOverlay"></div>
        <pre id="codePre"></pre>
        <div class="copy-warning" id="copyWarning">⚠️ 代码仅供学习查看，不可复制</div>
      </div>
    </div>
  `;

  // 保存两个 tab 的内容
  panel._explainHtml = explainHtml;
  panel._codeHtml = codeHtml;

  // 显示当前 tab
  if (currentTab === 'explain') {
    panel.innerHTML = explainHtml;
  } else {
    panel.innerHTML = codeHtml;
    document.getElementById('codePre').innerHTML = highlightCode(step.newCode);
  }

  // 更新 tab 状态
  document.querySelectorAll('.panel-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === currentTab);
  });

  updatePreview();
}

// ===== 更新预览 =====
function updatePreview() {
  const frame = document.getElementById('previewFrame');
  const html = buildPreviewHtml(currentStep);
  frame.srcdoc = html;
}

// ===== 切换标签 =====
function switchTab(tab) {
  currentTab = tab;
  const panel = document.getElementById('panelContent');
  const step = stepData[currentStep];

  document.querySelectorAll('.panel-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === tab);
  });

  if (tab === 'explain') {
    if (panel._explainHtml) panel.innerHTML = panel._explainHtml;
  } else {
    if (panel._codeHtml) {
      panel.innerHTML = panel._codeHtml;
      const codePre = document.getElementById('codePre');
      if (codePre && step.newCode) {
        codePre.innerHTML = highlightCode(step.newCode);
      } else if (codePre && step.isComplete) {
        codePre.innerHTML = highlightCode(fullProjectCode);
      }
    }
  }
}

// ===== 导航 =====
function goStep(delta) {
  const next = currentStep + delta;
  if (next >= 0 && next < stepData.length) {
    currentStep = next;
    currentTab = 'explain';
    renderStep();
  }
}

function goToStep(index) {
  if (index >= 0 && index < stepData.length) {
    currentStep = index;
    currentTab = 'explain';
    renderStep();
  }
}

// ===== 移动端预览切换 =====
function togglePreview() {
  const rp = document.getElementById('rightPanel');
  rp.classList.toggle('show');
}

// ===== 复制保护 =====
document.addEventListener('copy', function(e) {
  const codeBody = document.getElementById('codeBody');
  if (codeBody && codeBody.contains(e.target)) {
    e.preventDefault();
    showCopyWarning();
  }
});

document.addEventListener('cut', function(e) {
  const codeBody = document.getElementById('codeBody');
  if (codeBody && codeBody.contains(e.target)) {
    e.preventDefault();
    showCopyWarning();
  }
});

document.addEventListener('contextmenu', function(e) {
  const codeBody = document.getElementById('codeBody');
  if (codeBody && codeBody.contains(e.target)) {
    e.preventDefault();
    showCopyWarning();
  }
});

document.addEventListener('keydown', function(e) {
  const codeBody = document.getElementById('codeBody');
  if (codeBody && codeBody.contains(e.target)) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 'c' || e.key === 'a' || e.key === 'u')) {
      e.preventDefault();
      showCopyWarning();
    }
  }
});

function showCopyWarning() {
  const warn = document.getElementById('copyWarning');
  if (warn) {
    warn.style.display = 'block';
    warn.style.animation = 'none';
    warn.offsetHeight;
    warn.style.animation = 'warnFade 1.5s forwards';
    setTimeout(() => { warn.style.display = 'none'; }, 1600);
  }
}

// ===== 礼花特效 =====
function launchConfetti() {
  const canvas = document.getElementById('confettiCanvas');
  const ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const particles = [];
  const colors = ['#667eea', '#764ba2', '#f093fb', '#ffd43b', '#51cf66', '#ff6b6b', '#74c0fc'];

  for (let i = 0; i < 150; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height - canvas.height,
      w: Math.random() * 10 + 4,
      h: Math.random() * 6 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 3 + 2,
      rot: Math.random() * 360,
      rotV: (Math.random() - 0.5) * 10,
      opacity: 1
    });
  }

  let frame = 0;
  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.rotV;
      p.vy += 0.05;
      if (frame > 60) p.opacity -= 0.008;
      if (p.opacity <= 0) return;
      alive = true;
      ctx.save();
      ctx.globalAlpha = Math.max(0, p.opacity);
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    });
    frame++;
    if (alive && frame < 200) {
      requestAnimationFrame(animate);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  animate();
}

// ===== 键盘导航 =====
document.addEventListener('keydown', function(e) {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    goStep(1);
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    goStep(-1);
  }
});

// ===== 初始化 =====
renderSidebar();
renderStep();
</script>
</body>
