<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页</title>
  <style>
    :root {
      --bg-start: #f6efe8;
      --bg-mid: #dbeafe;
      --bg-end: #c7f9cc;
      --text-main: #1f2937;
      --text-muted: #4b5563;
      --card-bg: rgba(255, 255, 255, 0.76);
      --card-border: rgba(255, 255, 255, 0.45);
      --accent: #0f766e;
      --shadow: 0 24px 60px rgba(31, 41, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.9), transparent 32%),
        linear-gradient(135deg, var(--bg-start), var(--bg-mid) 55%, var(--bg-end));
    }

    .card {
      width: min(760px, 100%);
      padding: 40px;
      border-radius: 28px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
    }

    .tag {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(15, 118, 110, 0.1);
      color: var(--accent);
      font-size: 14px;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 18px 0 12px;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.05;
    }

    .subtitle {
      margin: 0 0 28px;
      max-width: 560px;
      font-size: 1.08rem;
      line-height: 1.8;
      color: var(--text-muted);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .panel {
      padding: 22px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      color: var(--accent);
    }

    p,
    li {
      margin: 0;
      font-size: 0.98rem;
      line-height: 1.8;
      color: var(--text-main);
    }

    ul {
      margin: 0;
      padding-left: 20px;
    }

    @media (max-width: 640px) {
      .card {
        padding: 28px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">PERSONAL HOME</span>
    <h1>林知远</h1>
    <p class="subtitle">
      你好，我是一名热爱设计与技术的创作者，喜欢用简洁的方式表达想法，
      也喜欢把细节打磨到恰到好处。这里是我的个人主页，一个安静、清爽的小角落。
    </p>

    <section class="grid">
      <article class="panel">
        <h2>简介</h2>
        <p>
          目前专注于前端设计、网页体验和内容创作，希望通过有温度的视觉与清晰的信息表达，
          做出让人愿意停留的作品。
        </p>
      </article>

      <article class="panel">
        <h2>兴趣爱好</h2>
        <ul>
          <li>摄影，记录光影与日常</li>
          <li>阅读，偏爱人文与设计类内容</li>
          <li>旅行，观察不同城市的节奏与美感</li>
        </ul>
      </article>
    </section>
  </main>
</body>
</html>
