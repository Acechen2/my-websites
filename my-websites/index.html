<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>推箱子 - Sokoban</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

:root{
  --bg:#0a0e1a;--bg2:#111827;--card:#1a2236;
  --accent:#00e5ff;--accent2:#ff6b35;--accent3:#a855f7;
  --gold:#ffd700;--green:#00e676;--red:#ff5252;
  --text:#e0e7ff;--muted:#64748b;--border:#1e3a5f;
  --wall:#2d3a5c;--floor:#0f1729;--target:#ff6b35;
}

body{
  background:var(--bg);color:var(--text);
  font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;
  overflow-x:hidden;
  background-image:
    radial-gradient(ellipse at 20% 50%,rgba(0,229,255,.05) 0%,transparent 50%),
    radial-gradient(ellipse at 80% 20%,rgba(168,85,247,.05) 0%,transparent 50%),
    radial-gradient(ellipse at 50% 80%,rgba(255,107,53,.05) 0%,transparent 50%);
}

/* Stars background */
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) infinite alternate}
@keyframes twinkle{0%{opacity:.2;transform:scale(.8)}100%{opacity:1;transform:scale(1.2)}}

/* Header */
.header{
  position:relative;z-index:1;text-align:center;
  padding:30px 20px 10px;width:100%;max-width:800px;
}
.header h1{
  font-family:'Orbitron',monospace;font-size:2.4em;font-weight:900;
  background:linear-gradient(135deg,var(--accent),var(--accent3),var(--accent2));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  text-shadow:none;letter-spacing:3px;
  animation:glow 3s ease-in-out infinite alternate;
}
@keyframes glow{
  0%{filter:brightness(1) drop-shadow(0 0 10px rgba(0,229,255,.3))}
  100%{filter:brightness(1.2) drop-shadow(0 0 20px rgba(168,85,247,.4))}
}
.header .subtitle{color:var(--muted);font-size:.9em;margin-top:6px;letter-spacing:2px}

/* Stats Bar */
.stats-bar{
  position:relative;z-index:1;display:flex;gap:16px;
  justify-content:center;flex-wrap:wrap;
  padding:12px 20px;margin:10px 0;
}
.stat{
  background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:8px 18px;text-align:center;
  min-width:90px;transition:all .3s;
}
.stat:hover{border-color:var(--accent);transform:translateY(-2px)}
.stat .label{font-size:.7em;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.stat .value{font-family:'Orbitron',monospace;font-size:1.3em;font-weight:700;color:var(--accent)}
.stat.gold .value{color:var(--gold)}
.stat.green .value{color:var(--green)}

/* Level Selector */
.level-select{
  position:relative;z-index:1;display:flex;gap:8px;
  flex-wrap:wrap;justify-content:center;padding:8px 20px;
}
.level-btn{
  width:44px;height:44px;border-radius:10px;border:2px solid var(--border);
  background:var(--card);color:var(--text);font-family:'Orbitron',monospace;
  font-size:1em;font-weight:700;cursor:pointer;transition:all .3s;
  display:flex;align-items:center;justify-content:center;position:relative;
}
.level-btn:hover{border-color:var(--accent);transform:scale(1.1)}
.level-btn.active{border-color:var(--accent);background:rgba(0,229,255,.15);color:var(--accent);box-shadow:0 0 15px rgba(0,229,255,.3)}
.level-btn.completed::after{
  content:'✓';position:absolute;top:-6px;right:-6px;
  background:var(--green);color:#000;font-size:.6em;font-weight:900;
  width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;
}

/* Game Container */
.game-wrap{
  position:relative;z-index:1;margin:10px auto;
  display:flex;flex-direction:column;align-items:center;
}
.game-board{
  position:relative;border-radius:16px;overflow:hidden;
  border:2px solid var(--border);
  box-shadow:0 0 40px rgba(0,229,255,.1),inset 0 0 40px rgba(0,0,0,.5);
  background:var(--floor);
}

/* Cells */
.cell{
  position:absolute;display:flex;align-items:center;justify-content:center;
  font-size:1.8em;transition:all .15s ease;
}
.cell-wall{
  background:linear-gradient(135deg,#2d3a5c,#1a2744);
  border:1px solid rgba(100,116,139,.3);
  box-shadow:inset 0 0 10px rgba(0,0,0,.5);
}
.cell-floor{
  background:rgba(15,23,41,.6);
  border:1px solid rgba(30,58,95,.2);
}
.cell-target{
  background:rgba(15,23,41,.6);
  border:1px solid rgba(30,58,95,.2);
}
.cell-target::after{
  content:'';position:absolute;width:40%;height:40%;
  border:3px solid var(--accent2);border-radius:50%;
  animation:pulse-target 2s ease-in-out infinite;
}
@keyframes pulse-target{
  0%,100%{opacity:.4;transform:scale(.8)}
  50%{opacity:1;transform:scale(1.1)}
}

/* Game Objects (rendered on top) */
.game-obj{
  position:absolute;display:flex;align-items:center;justify-content:center;
  transition:left .15s ease,top .15s ease;z-index:2;
}
.obj-player{
  z-index:5;
}
.obj-player .player-body{
  width:70%;height:70%;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#5eead4,var(--accent),#0891b2);
  box-shadow:0 0 15px rgba(0,229,255,.5),0 0 30px rgba(0,229,255,.2);
  display:flex;align-items:center;justify-content:center;
  animation:breathe 2s ease-in-out infinite;
  position:relative;
}
.player-body .eye{
  width:6px;height:6px;background:#0a0e1a;border-radius:50%;position:absolute;
}
.player-body .eye-l{top:30%;left:25%}
.player-body .eye-r{top:30%;right:25%}
.player-body .mouth{
  width:10px;height:5px;border-bottom:2px solid #0a0e1a;
  border-radius:0 0 50% 50%;position:absolute;bottom:25%;left:50%;transform:translateX(-50%);
}
@keyframes breathe{
  0%,100%{transform:scale(1)}50%{transform:scale(1.06)}
}

.obj-box{
  z-index:3;
}
.obj-box .box-body{
  width:72%;height:72%;border-radius:8px;
  background:linear-gradient(135deg,var(--accent2),#e85d26);
  box-shadow:0 3px 10px rgba(255,107,53,.3),inset 0 1px 0 rgba(255,255,255,.2);
  display:flex;align-items:center;justify-content:center;
  font-size:.5em;color:rgba(255,255,255,.6);font-weight:900;
  transition:all .3s;
}
.obj-box.on-target .box-body{
  background:linear-gradient(135deg,var(--green),#00c853);
  box-shadow:0 3px 15px rgba(0,230,118,.4),inset 0 1px 0 rgba(255,255,255,.3);
  animation:box-land .4s ease;
}
@keyframes box-land{
  0%{transform:scale(1)}50%{transform:scale(1.15)}100%{transform:scale(1)}
}

/* Controls */
.controls{
  position:relative;z-index:1;display:flex;gap:10px;
  margin:12px 0;flex-wrap:wrap;justify-content:center;
}
.ctrl-btn{
  padding:10px 20px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);cursor:pointer;
  font-size:.9em;transition:all .3s;display:flex;align-items:center;gap:6px;
}
.ctrl-btn:hover{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 4px 15px rgba(0,229,255,.2)}
.ctrl-btn:active{transform:translateY(0)}
.ctrl-btn.primary{border-color:var(--accent);color:var(--accent)}
.ctrl-btn.warn{border-color:var(--accent2);color:var(--accent2)}

/* D-pad */
.dpad{
  position:relative;z-index:1;display:grid;
  grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,56px);
  gap:4px;margin:8px 0;
}
.dpad-btn{
  border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--accent);
  font-size:1.4em;cursor:pointer;transition:all .15s;
  display:flex;align-items:center;justify-content:center;
  -webkit-user-select:none;user-select:none;
}
.dpad-btn:hover{background:rgba(0,229,255,.1);border-color:var(--accent)}
.dpad-btn:active{background:rgba(0,229,255,.2);transform:scale(.92)}
.dpad-empty{visibility:hidden}

/* Win Overlay */
.win-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;
  background:rgba(0,0,0,.7);backdrop-filter:blur(5px);
  display:none;align-items:center;justify-content:center;
  animation:fadeIn .3s;
}
.win-overlay.show{display:flex}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.win-card{
  background:var(--card);border:2px solid var(--accent);
  border-radius:20px;padding:40px 50px;text-align:center;
  box-shadow:0 0 60px rgba(0,229,255,.3);
  animation:popIn .4s cubic-bezier(.175,.885,.32,1.275);
}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.win-card h2{
  font-family:'Orbitron',monospace;font-size:2em;
  color:var(--gold);margin-bottom:10px;
}
.win-card p{color:var(--muted);margin:8px 0}
.win-card .stars-earned{font-size:2em;margin:15px 0}
.win-card button{
  margin-top:15px;padding:12px 30px;border-radius:12px;
  border:2px solid var(--accent);background:rgba(0,229,255,.1);
  color:var(--accent);font-size:1em;cursor:pointer;transition:all .3s;
  font-family:'Orbitron',monospace;
}
.win-card button:hover{background:rgba(0,229,255,.2);transform:scale(1.05)}

/* Particles */
.particle{
  position:fixed;pointer-events:none;z-index:101;
  border-radius:50%;animation:particleFly 1s ease-out forwards;
}
@keyframes particleFly{
  0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}
}

/* How to play modal */
.modal-overlay{
  position:fixed;top:0;left:0;width:100%;height:100%;z-index:90;
  background:rgba(0,0,0,.6);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;
}
.modal-overlay.show{display:flex}
.modal-card{
  background:var(--card);border:2px solid var(--border);
  border-radius:20px;padding:30px;max-width:420px;width:90%;
  animation:popIn .3s;
}
.modal-card h3{
  font-family:'Orbitron',monospace;color:var(--accent);margin-bottom:15px;font-size:1.2em;
}
.modal-card .rule{
  display:flex;align-items:center;gap:12px;margin:10px 0;
  padding:10px;border-radius:10px;background:rgba(0,229,255,.05);
}
.modal-card .rule-icon{font-size:1.5em;min-width:36px;text-align:center}
.modal-card .rule-text{font-size:.9em;color:var(--text);line-height:1.5}
.modal-card .close-btn{
  margin-top:15px;width:100%;padding:10px;border-radius:10px;
  border:1px solid var(--border);background:var(--card);
  color:var(--accent);cursor:pointer;font-size:.9em;transition:all .3s;
}
.modal-card .close-btn:hover{border-color:var(--accent);background:rgba(0,229,255,.1)}

/* Responsive */
@media(max-width:600px){
  .header{padding:16px 12px 6px}
  .header h1{font-size:1.5em;letter-spacing:1px}
  .header .subtitle{font-size:.75em}
  .stats-bar{gap:8px;padding:8px 10px;margin:6px 0}
  .stat{min-width:65px;padding:5px 10px;border-radius:8px}
  .stat .label{font-size:.6em}
  .stat .value{font-size:1em}
  .level-select{gap:5px;padding:5px 10px}
  .level-btn{width:36px;height:36px;border-radius:8px;font-size:.85em}
  .level-btn.completed::after{width:13px;height:13px;font-size:.5em;top:-4px;right:-4px}
  .game-wrap{margin:6px auto}
  .game-board{border-radius:10px}
  .controls{gap:6px;margin:8px 0}
  .ctrl-btn{padding:8px 14px;border-radius:8px;font-size:.8em}
  .dpad{
    grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);
    gap:5px;margin:5px 0;
  }
  .dpad-btn{border-radius:14px;font-size:1.6em}
  .win-card{padding:25px 30px;border-radius:16px}
  .win-card h2{font-size:1.5em}
  .modal-card{padding:20px;border-radius:16px}
  .modal-card .rule{padding:8px;gap:8px}
  .modal-card .rule-icon{font-size:1.2em;min-width:28px}
  .modal-card .rule-text{font-size:.8em}
}
@media(max-width:380px){
  .header h1{font-size:1.2em}
  .stat{min-width:55px;padding:4px 8px}
  .stat .value{font-size:.85em}
  .dpad{
    grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);
  }
}
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<!-- Header -->
<div class="header">
  <h1>SOKOBAN</h1>
  <div class="subtitle">推 箱 子</div>
</div>

<!-- Stats -->
<div class="stats-bar">
  <div class="stat"><div class="label">关卡</div><div class="value" id="levelNum">1</div></div>
  <div class="stat gold"><div class="label">步数</div><div class="value" id="steps">0</div></div>
  <div class="stat green"><div class="label">推箱</div><div class="value" id="pushes">0</div></div>
  <div class="stat"><div class="label">最佳</div><div class="value" id="best">-</div></div>
</div>

<!-- Level Select -->
<div class="level-select" id="levelSelect"></div>

<!-- Game -->
<div class="game-wrap">
  <div class="game-board" id="board"></div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="ctrl-btn primary" onclick="undoMove()">↩ 撤销</button>
  <button class="ctrl-btn" onclick="resetLevel()">🔄 重来</button>
  <button class="ctrl-btn warn" onclick="showHelp()">❓ 玩法</button>
</div>

<!-- D-pad -->
<div class="dpad">
  <div class="dpad-empty"></div>
  <button class="dpad-btn" ontouchstart="move(0,-1);event.preventDefault()" onmousedown="move(0,-1)">▲</button>
  <div class="dpad-empty"></div>
  <button class="dpad-btn" ontouchstart="move(-1,0);event.preventDefault()" onmousedown="move(-1,0)">◀</button>
  <button class="dpad-btn" style="font-size:.6em;color:var(--muted)">●</button>
  <button class="dpad-btn" ontouchstart="move(1,0);event.preventDefault()" onmousedown="move(1,0)">▶</button>
  <div class="dpad-empty"></div>
  <button class="dpad-btn" ontouchstart="move(0,1);event.preventDefault()" onmousedown="move(0,1)">▼</button>
  <div class="dpad-empty"></div>
</div>

<!-- Win Overlay -->
<div class="win-overlay" id="winOverlay">
  <div class="win-card">
    <h2>🎉 过关！</h2>
    <div class="stars-earned" id="winStars"></div>
    <p>步数：<strong id="winSteps">0</strong> &nbsp; 推箱：<strong id="winPushes">0</strong></p>
    <p id="winBest" style="color:var(--gold)"></p>
    <button onclick="nextLevel()">下一关 →</button>
  </div>
</div>

<!-- Help Modal -->
<div class="modal-overlay" id="helpModal">
  <div class="modal-card">
    <h3>🎮 游戏规则</h3>
    <div class="rule"><div class="rule-icon">🧑</div><div class="rule-text">你是<strong>玩家</strong>，用方向键或WASD移动</div></div>
    <div class="rule"><div class="rule-icon">📦</div><div class="rule-text">推动<strong>箱子</strong>到橙色目标点上</div></div>
    <div class="rule"><div class="rule-icon">✅</div><div class="rule-text">箱子到达目标会变<strong>绿色</strong></div></div>
    <div class="rule"><div class="rule-icon">🚫</div><div class="rule-text">只能<strong>推</strong>不能拉，一次只能推一个箱子</div></div>
    <div class="rule"><div class="rule-icon">🧱</div><div class="rule-text">碰到墙壁或箱子就不能继续移动</div></div>
    <button class="close-btn" onclick="hideHelp()">知道了！</button>
  </div>
</div>

<script>
// ===== LEVEL DATA =====
const LEVELS = [
  { name:"初识", map:[
    "  ###  ",
    "  #.#  ",
    "  # ###",
    "###$ .#",
    "#. $@##",
    "####  #",
    "   ####"
  ]},
  { name:"并行", map:[
    " ####  ",
    " #  ###",
    " # $  #",
    "## .# #",
    "#  .$ #",
    "#  @  #",
    "#######"
  ]},
  { name:"迂回", map:[
    "###### ",
    "#    # ",
    "# #@$ #",
    "# ..  #",
    "#  $  #",
    "#  ####",
    "####   "
  ]},
  { name:"对角", map:[
    "  ####  ",
    "###  ###",
    "#  $   #",
    "# #.#  #",
    "#  .@$ #",
    "#   ####",
    "#####   "
  ]},
  { name:"L形", map:[
    "  #####",
    "###   #",
    "# $ # #",
    "# .   #",
    "# .#$@#",
    "#   ###",
    "#####  "
  ]},
  { name:"锁匙", map:[
    "  ####  ",
    "  #  ###",
    "  # $$ #",
    "###. . #",
    "#  # @ #",
    "#  #####",
    "####    "
  ]},
  { name:"围城", map:[
    " ##### ",
    "##   ##",
    "# $$  #",
    "# .#. #",
    "#  @  #",
    "##  ###",
    " ####  "
  ]},
  { name:"十字", map:[
    "  ###   ",
    "###.### ",
    "#  $  # ",
    "# .#$ # ",
    "##  @ ##",
    " # $  # ",
    " # .  # ",
    " ###### "
  ]},
  { name:"迷宫", map:[
    " ###### ",
    "##    ##",
    "# $ $  #",
    "# .#. ##",
    "## . @ #",
    " # $ $ #",
    " # ..  #",
    " #######"
  ]},
  { name:"大师", map:[
    "  ######",
    "###    #",
    "# $  $ #",
    "# .##. #",
    "#  ..  #",
    "## $ $ #",
    " # @ ###",
    " #####  "
  ]}
];

// ===== GAME STATE =====
let currentLevel = 0;
let grid = [];        // static map: 'wall','floor','target'
let playerPos = {x:0,y:0};
let boxes = [];       // [{x,y}]
let targets = [];     // [{x,y}]
let cols = 0, rows = 0;
let steps = 0, pushes = 0;
let history = [];     // for undo
let completed = {};   // levelIndex -> bestScore
let gameWon = false;

const BASE_CELL = 52;
let CELL = BASE_CELL;

function calcCellSize(){
  const maxW = Math.min(window.innerWidth - 20, 800);
  const maxH = window.innerHeight * 0.45;
  const cellW = Math.floor(maxW / cols);
  const cellH = Math.floor(maxH / rows);
  CELL = Math.min(BASE_CELL, cellW, cellH);
  CELL = Math.max(CELL, 28); // minimum size
}

// ===== INIT =====
function initStars(){
  const c=document.getElementById('stars');
  c.innerHTML='';
  for(let i=0;i<80;i++){
    const s=document.createElement('div');s.className='star';
    s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${1+Math.random()*2}px;height:${1+Math.random()*2}px;--d:${1+Math.random()*3}s;animation-delay:${Math.random()*3}s`;
    c.appendChild(s);
  }
}

function loadLevel(idx){
  currentLevel=idx;
  const level=LEVELS[idx];
  const map=level.map;
  rows=map.length;
  cols=Math.max(...map.map(r=>r.length));
  grid=[];boxes=[];targets=[];history=[];
  steps=0;pushes=0;gameWon=false;

  calcCellSize();

  // First pass: parse all chars, mark spaces as 'unknown' temporarily
  for(let y=0;y<rows;y++){
    grid[y]=[];
    for(let x=0;x<cols;x++){
      const ch=(map[y]||'')[x]||' ';
      if(ch==='#'){grid[y][x]='wall';}
      else if(ch==='.'){grid[y][x]='target';targets.push({x,y});}
      else if(ch==='$'){grid[y][x]='floor';boxes.push({x,y});}
      else if(ch==='@'){grid[y][x]='floor';playerPos={x,y};}
      else if(ch==='*'){grid[y][x]='target';boxes.push({x,y});targets.push({x,y});}
      else if(ch==='+'){grid[y][x]='target';playerPos={x,y};targets.push({x,y});}
      else{grid[y][x]='unknown';}
    }
  }
  // BFS from player: all reachable 'unknown' cells become 'floor'
  markFloors();
  // Any remaining 'unknown' cells become 'empty' (outside the map)
  for(let y=0;y<rows;y++)
    for(let x=0;x<cols;x++)
      if(grid[y][x]==='unknown') grid[y][x]='empty';

  document.getElementById('levelNum').textContent=idx+1;
  document.getElementById('steps').textContent=0;
  document.getElementById('pushes').textContent=0;
  document.getElementById('best').textContent=completed[idx]||'-';
  document.getElementById('winOverlay').classList.remove('show');

  renderLevelSelect();
  renderBoard();
}

function markFloors(){
  // BFS from player to find all reachable cells, mark 'unknown' as 'floor'
  const visited=Array.from({length:rows},()=>Array(cols).fill(false));
  const q=[{...playerPos}];
  visited[playerPos.y][playerPos.x]=true;
  while(q.length){
    const{x,y}=q.shift();
    for(const[dx,dy]of[[0,1],[0,-1],[1,0],[-1,0]]){
      const nx=x+dx,ny=y+dy;
      if(nx>=0&&nx<cols&&ny>=0&&ny<rows&&!visited[ny][nx]&&grid[ny][nx]!=='wall'){
        visited[ny][nx]=true;
        if(grid[ny][nx]==='unknown') grid[ny][nx]='floor';
        q.push({x:nx,y:ny});
      }
    }
  }
}

// ===== RENDER =====
function renderBoard(){
  const board=document.getElementById('board');
  board.innerHTML='';
  board.style.width=cols*CELL+'px';
  board.style.height=rows*CELL+'px';

  // Render static cells
  for(let y=0;y<rows;y++){
    for(let x=0;x<cols;x++){
      if(grid[y][x]==='empty') continue;
      const cell=document.createElement('div');
      cell.className='cell';
      cell.style.left=x*CELL+'px';cell.style.top=y*CELL+'px';
      cell.style.width=CELL+'px';cell.style.height=CELL+'px';
      if(grid[y][x]==='wall') cell.classList.add('cell-wall');
      else if(grid[y][x]==='target') cell.classList.add('cell-target');
      else cell.classList.add('cell-floor');
      board.appendChild(cell);
    }
  }

  // Render boxes
  boxes.forEach((b,i)=>{
    const el=document.createElement('div');
    el.className='game-obj obj-box';el.id='box-'+i;
    el.style.left=b.x*CELL+'px';el.style.top=b.y*CELL+'px';
    el.style.width=CELL+'px';el.style.height=CELL+'px';
    const inner=document.createElement('div');inner.className='box-body';inner.textContent='📦';
    el.appendChild(inner);
    if(isOnTarget(b.x,b.y)) el.classList.add('on-target');
    board.appendChild(el);
  });

  // Render player
  const pel=document.createElement('div');
  pel.className='game-obj obj-player';pel.id='player';
  pel.style.left=playerPos.x*CELL+'px';pel.style.top=playerPos.y*CELL+'px';
  pel.style.width=CELL+'px';pel.style.height=CELL+'px';
  pel.innerHTML='<div class="player-body"><div class="eye eye-l"></div><div class="eye eye-r"></div><div class="mouth"></div></div>';
  board.appendChild(pel);
}

function updatePositions(){
  const pel=document.getElementById('player');
  if(pel){pel.style.left=playerPos.x*CELL+'px';pel.style.top=playerPos.y*CELL+'px';}
  boxes.forEach((b,i)=>{
    const el=document.getElementById('box-'+i);
    if(el){
      el.style.left=b.x*CELL+'px';el.style.top=b.y*CELL+'px';
      if(isOnTarget(b.x,b.y)) el.classList.add('on-target');
      else el.classList.remove('on-target');
    }
  });
  document.getElementById('steps').textContent=steps;
  document.getElementById('pushes').textContent=pushes;
}

function renderLevelSelect(){
  const c=document.getElementById('levelSelect');
  c.innerHTML='';
  LEVELS.forEach((lv,i)=>{
    const btn=document.createElement('button');
    btn.className='level-btn'+(i===currentLevel?' active':'')+(completed[i]!==undefined?' completed':'');
    btn.textContent=i+1;
    btn.onclick=()=>loadLevel(i);
    btn.title=lv.name;
    c.appendChild(btn);
  });
}

// ===== GAME LOGIC =====
function isWall(x,y){
  if(x<0||x>=cols||y<0||y>=rows) return true;
  return grid[y][x]==='wall'||grid[y][x]==='empty';
}
function isBox(x,y){return boxes.some(b=>b.x===x&&b.y===y);}
function isOnTarget(x,y){return targets.some(t=>t.x===x&&t.y===y);}
function getBoxIndex(x,y){return boxes.findIndex(b=>b.x===x&&b.y===y);}

function move(dx,dy){
  if(gameWon) return;
  const nx=playerPos.x+dx, ny=playerPos.y+dy;
  if(isWall(nx,ny)) return;

  let pushed=false;
  if(isBox(nx,ny)){
    const bx=nx+dx, by=ny+dy;
    if(isWall(bx,by)||isBox(bx,by)) return;
    // Save state for undo
    history.push({px:playerPos.x,py:playerPos.y,bi:getBoxIndex(nx,ny),bx:nx,by:ny,steps,pushes});
    const bi=getBoxIndex(nx,ny);
    boxes[bi].x=bx;boxes[bi].y=by;
    pushed=true;
    pushes++;
    // Play push sound
    playSound(pushed?'push':'move');
  } else {
    history.push({px:playerPos.x,py:playerPos.y,bi:-1,bx:0,by:0,steps,pushes});
  }

  playerPos.x=nx;playerPos.y=ny;
  steps++;
  updatePositions();
  checkWin();
}

function undoMove(){
  if(!history.length||gameWon) return;
  const h=history.pop();
  playerPos.x=h.px;playerPos.y=h.py;
  if(h.bi>=0){boxes[h.bi].x=h.bx;boxes[h.bi].y=h.by;}
  steps=h.steps;pushes=h.pushes;
  updatePositions();
  playSound('undo');
}

function resetLevel(){
  loadLevel(currentLevel);
  playSound('reset');
}

function checkWin(){
  if(targets.every(t=>isBox(t.x,t.y))){
    gameWon=true;
    const oldBest=completed[currentLevel];
    const isNewBest=oldBest===undefined||steps<oldBest;
    if(isNewBest) completed[currentLevel]=steps;
    document.getElementById('best').textContent=completed[currentLevel];

    // Show win overlay
    const starCount=steps<=getPar(currentLevel)*1?3:steps<=getPar(currentLevel)*1.5?2:1;
    document.getElementById('winStars').textContent='⭐'.repeat(starCount)+'☆'.repeat(3-starCount);
    document.getElementById('winSteps').textContent=steps;
    document.getElementById('winPushes').textContent=pushes;
    document.getElementById('winBest').textContent=isNewBest?'🏆 新纪录！':'最佳：'+completed[currentLevel]+'步';
    setTimeout(()=>{
      document.getElementById('winOverlay').classList.add('show');
      spawnParticles();
      playSound('win');
    },300);
    renderLevelSelect();
  }
}

function getPar(idx){
  return [8,12,10,14,12,16,14,18,22,26][idx]||15;
}

function nextLevel(){
  document.getElementById('winOverlay').classList.remove('show');
  if(currentLevel<LEVELS.length-1) loadLevel(currentLevel+1);
  else{loadLevel(0);showToast('🎉 全部通关！从头再来~');}
}

// ===== SOUND =====
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playSound(type){
  const osc=audioCtx.createOscillator();
  const gain=audioCtx.createGain();
  osc.connect(gain);gain.connect(audioCtx.destination);
  gain.gain.value=0.08;
  if(type==='move'){osc.frequency.value=440;osc.type='sine';gain.gain.value=0.04;}
  else if(type==='push'){osc.frequency.value=330;osc.type='triangle';}
  else if(type==='win'){
    osc.frequency.value=523;osc.type='sine';gain.gain.value=0.1;
    osc.start();osc.stop(audioCtx.currentTime+0.1);
    const o2=audioCtx.createOscillator();const g2=audioCtx.createGain();
    o2.connect(g2);g2.connect(audioCtx.destination);o2.frequency.value=659;o2.type='sine';g2.gain.value=0.1;
    o2.start(audioCtx.currentTime+0.1);o2.stop(audioCtx.currentTime+0.25);
    const o3=audioCtx.createOscillator();const g3=audioCtx.createGain();
    o3.connect(g3);g3.connect(audioCtx.destination);o3.frequency.value=784;o3.type='sine';g3.gain.value=0.1;
    o3.start(audioCtx.currentTime+0.25);o3.stop(audioCtx.currentTime+0.5);
    return;
  }
  else if(type==='undo'){osc.frequency.value=280;osc.type='sawtooth';gain.gain.value=0.03;}
  else if(type==='reset'){osc.frequency.value=200;osc.type='square';gain.gain.value=0.03;}
  osc.start();osc.stop(audioCtx.currentTime+0.08);
}

// ===== PARTICLES =====
function spawnParticles(){
  const colors=['#ffd700','#00e5ff','#a855f7','#ff6b35','#00e676','#ff5252'];
  for(let i=0;i<40;i++){
    const p=document.createElement('div');p.className='particle';
    const size=4+Math.random()*8;
    const angle=Math.random()*Math.PI*2;
    const dist=80+Math.random()*200;
    p.style.cssText=`left:50%;top:50%;width:${size}px;height:${size}px;background:${colors[i%colors.length]};--dx:${Math.cos(angle)*dist}px;--dy:${Math.sin(angle)*dist}px;animation-delay:${Math.random()*.3}s;animation-duration:${.6+Math.random()*.6}s`;
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),1500);
  }
}

// ===== TOAST =====
function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--accent);color:var(--accent);padding:12px 24px;border-radius:12px;z-index:200;animation:popIn .3s;font-size:.95em';
  t.textContent=msg;document.body.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300)},2000);
}

// ===== HELP =====
function showHelp(){document.getElementById('helpModal').classList.add('show')}
function hideHelp(){document.getElementById('helpModal').classList.remove('show')}

// ===== KEYBOARD =====
document.addEventListener('keydown',e=>{
  if(audioCtx.state==='suspended') audioCtx.resume();
  const key=e.key.toLowerCase();
  if(key==='arrowup'||key==='w'){e.preventDefault();move(0,-1)}
  else if(key==='arrowdown'||key==='s'){e.preventDefault();move(0,1)}
  else if(key==='arrowleft'||key==='a'){e.preventDefault();move(-1,0)}
  else if(key==='arrowright'||key==='d'){e.preventDefault();move(1,0)}
  else if(key==='z'&&(e.ctrlKey||e.metaKey)){e.preventDefault();undoMove()}
  else if(key==='r'){resetLevel()}
});

// Click outside help modal to close
document.getElementById('helpModal').addEventListener('click',e=>{
  if(e.target===e.currentTarget) hideHelp();
});
document.getElementById('winOverlay').addEventListener('click',e=>{
  if(e.target===e.currentTarget){document.getElementById('winOverlay').classList.remove('show')}
});

// ===== SWIPE SUPPORT =====
let touchStart=null;
document.addEventListener('touchstart',e=>{
  if(e.target.closest('.dpad')||e.target.closest('.ctrl-btn')||e.target.closest('.level-btn')) return;
  touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
},{passive:true});
document.addEventListener('touchend',e=>{
  if(!touchStart) return;
  const dx=e.changedTouches[0].clientX-touchStart.x;
  const dy=e.changedTouches[0].clientY-touchStart.y;
  touchStart=null;
  if(Math.abs(dx)<30&&Math.abs(dy)<30) return;
  if(Math.abs(dx)>Math.abs(dy)) move(dx>0?1:-1,0);
  else move(0,dy>0?1:-1);
},{passive:true});

// ===== RESIZE =====
let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(()=>{
    calcCellSize();
    renderBoard();
  },200);
});

// Prevent pull-to-refresh on mobile
document.addEventListener('touchmove',e=>{
  if(e.target.closest('.game-board')||e.target.closest('.dpad')) e.preventDefault();
},{passive:false});

// ===== START =====
initStars();
loadLevel(0);

// Save/Load progress
try{
  const saved=localStorage.getItem('sokoban_progress');
  if(saved) completed=JSON.parse(saved);
  renderLevelSelect();
  const lastLvl=localStorage.getItem('sokoban_lastLevel');
  if(lastLvl&&parseInt(lastLvl)<LEVELS.length) loadLevel(parseInt(lastLvl));
}catch(e){}
window.addEventListener('beforeunload',()=>{
  try{
    localStorage.setItem('sokoban_progress',JSON.stringify(completed));
    localStorage.setItem('sokoban_lastLevel',currentLevel.toString());
  }catch(e){}
});
</script>
