<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>🏎️ 漂移竞速 Drift Racing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a0f;--card:rgba(15,15,30,.92);--accent:#ff3e3e;--cyan:#00e5ff;--gold:#ffd700;--green:#00e676;--text:#e8eaf6;--muted:#7986cb}
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');
html,body{overflow:hidden;height:100%;width:100%;touch-action:none}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
canvas{display:block}

/* HUD */
.hud{position:fixed;top:0;left:0;width:100%;pointer-events:none;z-index:10;padding:10px 14px}
.hud-top{display:flex;justify-content:space-between;align-items:flex-start}
.hud-box{background:var(--card);backdrop-filter:blur(8px);border:1px solid rgba(255,62,62,.25);border-radius:10px;padding:8px 14px;margin-bottom:6px;min-width:100px}
.hud-label{font-size:.6em;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.hud-value{font-family:'Orbitron',monospace;font-size:1.4em;font-weight:700;color:var(--accent)}
.hud-value.cyan{color:var(--cyan)}
.hud-value.gold{color:var(--gold)}
.speed-bar{width:100%;height:5px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:4px;overflow:hidden}
.speed-fill{height:100%;background:linear-gradient(90deg,var(--cyan),var(--accent));border-radius:3px;transition:width .1s}
.drift-indicator{font-family:'Orbitron',monospace;font-size:.95em;color:var(--gold);text-align:center;margin-top:3px;opacity:0;transition:opacity .15s}
.drift-indicator.active{opacity:1;animation:driftPulse .25s infinite alternate}
@keyframes driftPulse{from{text-shadow:0 0 8px var(--gold)}to{text-shadow:0 0 20px var(--gold),0 0 40px var(--accent)}}

/* Touch hint */
.touch-hint{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);z-index:15;color:var(--muted);font-size:.8em;text-align:center;pointer-events:none;animation:fadeHint 3s ease 2s forwards;opacity:.7}
@keyframes fadeHint{to{opacity:0}}

/* Brake button */
.brake-zone{position:fixed;bottom:20px;right:20px;z-index:20;width:90px;height:90px;border-radius:50%;border:3px solid rgba(255,62,62,.4);background:rgba(255,62,62,.12);display:flex;align-items:center;justify-content:center;font-family:'Orbitron',monospace;font-size:.7em;font-weight:700;color:var(--accent);-webkit-user-select:none;user-select:none;transition:all .1s;pointer-events:auto}
.brake-zone:active,.brake-zone.pressed{background:rgba(255,62,62,.35);border-color:var(--accent);transform:scale(.93)}

/* Minimap */
.minimap{position:fixed;bottom:16px;left:16px;z-index:10;border-radius:10px;border:1px solid rgba(255,62,62,.25);background:var(--card);backdrop-filter:blur(8px);padding:4px;pointer-events:none}
.minimap canvas{border-radius:8px}

/* Start screen */
.start-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:rgba(10,10,15,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s}
.start-screen.hidden{opacity:0;pointer-events:none}
.start-screen h1{font-family:'Orbitron',monospace;font-size:2.6em;font-weight:900;background:linear-gradient(135deg,var(--accent),var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.start-screen .sub{color:var(--muted);font-size:.9em;letter-spacing:3px;margin-bottom:24px}
.track-select{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;justify-content:center;padding:0 16px}
.track-btn{background:var(--card);border:2px solid rgba(255,255,255,.1);border-radius:12px;padding:12px 18px;color:var(--text);cursor:pointer;transition:all .3s;text-align:center}
.track-btn:hover{border-color:var(--accent)}
.track-btn.active{border-color:var(--accent);background:rgba(255,62,62,.12);box-shadow:0 0 20px rgba(255,62,62,.15)}
.track-btn .name{font-family:'Orbitron',monospace;font-weight:700;font-size:.95em}
.track-btn .desc{font-size:.65em;color:var(--muted);margin-top:3px}
.start-btn{font-family:'Orbitron',monospace;font-size:1.1em;font-weight:700;padding:13px 36px;border-radius:14px;border:2px solid var(--accent);background:rgba(255,62,62,.12);color:var(--accent);cursor:pointer;transition:all .3s;letter-spacing:2px}
.start-btn:hover{background:rgba(255,62,62,.25);transform:scale(1.05);box-shadow:0 0 25px rgba(255,62,62,.25)}
.controls-hint{margin-top:18px;color:var(--muted);font-size:.75em;text-align:center;line-height:1.9;padding:0 20px}
.controls-hint kbd{background:var(--card);border:1px solid rgba(255,255,255,.12);border-radius:4px;padding:2px 6px;font-family:'Orbitron',monospace;font-size:.75em;color:var(--cyan)}

/* Countdown */
.countdown{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;font-family:'Orbitron',monospace;font-size:4.5em;font-weight:900;color:var(--accent);text-shadow:0 0 40px rgba(255,62,62,.5);animation:countPop .4s ease;display:none}
@keyframes countPop{from{transform:translate(-50%,-50%) scale(2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* Finish */
.finish-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:80;background:rgba(10,10,15,.88);backdrop-filter:blur(5px);display:none;align-items:center;justify-content:center}
.finish-overlay.show{display:flex}
.finish-card{background:var(--card);border:2px solid var(--gold);border-radius:18px;padding:30px 40px;text-align:center;box-shadow:0 0 50px rgba(255,215,0,.2);animation:countPop .4s}
.finish-card h2{font-family:'Orbitron',monospace;font-size:1.8em;color:var(--gold);margin-bottom:8px}
.finish-card .time{font-family:'Orbitron',monospace;font-size:2.2em;color:var(--cyan);margin:8px 0}
.finish-card .stats{color:var(--muted);margin:6px 0;font-size:.85em}
.finish-card button{margin:6px;padding:11px 24px;border-radius:12px;border:2px solid var(--accent);background:rgba(255,62,62,.1);color:var(--accent);font-family:'Orbitron',monospace;cursor:pointer;transition:all .3s;font-size:.85em}
.finish-card button:hover{background:rgba(255,62,62,.25);transform:scale(1.05)}

/* Touch zone visual */
.steer-zone{position:fixed;top:0;left:0;width:70%;height:100%;z-index:15;pointer-events:auto}
.gas-zone{position:fixed;top:0;right:0;width:30%;height:70%;z-index:15;pointer-events:auto;display:flex;align-items:center;justify-content:center}
.gas-label{font-family:'Orbitron',monospace;font-size:.7em;color:rgba(0,230,118,.3);letter-spacing:2px;pointer-events:none}

@media(min-width:901px){
  .steer-zone,.gas-zone,.brake-zone{display:none}
}
@media(max-width:900px){
  .brake-zone{display:flex}
}
@media(max-width:400px){
  .start-screen h1{font-size:1.8em}
  .hud-box{padding:6px 10px;min-width:80px}
  .hud-value{font-size:1.1em}
  .track-btn{padding:10px 14px}
  .track-btn .name{font-size:.8em}
}
</style>
</head>
<body>

<canvas id="game"></canvas>

<!-- HUD -->
<div class="hud" id="hud" style="display:none">
  <div class="hud-top">
    <div>
      <div class="hud-box">
        <div class="hud-label">速度 km/h</div>
        <div class="hud-value cyan" id="speedVal">0</div>
        <div class="speed-bar"><div class="speed-fill" id="speedBar"></div></div>
      </div>
      <div class="hud-box">
        <div class="hud-label">圈数</div>
        <div class="hud-value gold" id="lapVal">1/3</div>
      </div>
      <div class="hud-box">
        <div class="hud-label">用时</div>
        <div class="hud-value" id="timeVal">0:00.0</div>
      </div>
    </div>
    <div>
      <div class="hud-box" style="text-align:right">
        <div class="hud-label">漂移分</div>
        <div class="hud-value gold" id="driftScore">0</div>
      </div>
      <div class="drift-indicator" id="driftInd">🔥 DRIFT!</div>
    </div>
  </div>
</div>

<!-- Minimap -->
<div class="minimap" id="minimapWrap" style="display:none"><canvas id="minimap" width="120" height="120"></canvas></div>

<!-- Touch zones (mobile only) -->
<div class="steer-zone" id="steerZone"></div>
<div class="gas-zone" id="gasZone"><div class="gas-label">GAS</div></div>
<div class="brake-zone" id="brakeZone">BRAKE</div>

<!-- Touch hint -->
<div class="touch-hint" id="touchHint">👆 左侧滑动转向 · 右侧按住加速 · 刹车键减速</div>

<!-- Start Screen -->
<div class="start-screen" id="startScreen">
  <h1>DRIFT RACING</h1>
  <div class="sub">漂 移 竞 速</div>
  <div class="track-select" id="trackSelect"></div>
  <button class="start-btn" onclick="startGame()">🚀 开始比赛</button>
  <div class="controls-hint" id="controlsHint"></div>
</div>

<!-- Countdown -->
<div class="countdown" id="countdown"></div>

<!-- Finish -->
<div class="finish-overlay" id="finishOverlay">
  <div class="finish-card">
    <h2>🏆 完赛！</h2>
    <div class="time" id="finishTime">0:00.0</div>
    <div class="stats" id="finishStats"></div>
    <button onclick="restartGame()">🔄 再来一局</button>
    <button onclick="backToMenu()">📋 选择赛道</button>
  </div>
</div>

<script>
// ========== CONFIG ==========
const TRACKS = [
  { name:"环形赛道", desc:"入门经典", points:genOval(), laps:3, width:110 },
  { name:"发夹弯道", desc:"漂移天堂", points:genHairpin(), laps:3, width:105 },
  { name:"城市街道", desc:"高速挑战", points:genCity(), laps:3, width:100 }
];

let selectedTrack = 0;
let gameState = 'menu';

// ========== TRACK GENERATORS ==========
function genOval(){
  const pts=[];
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2;pts.push({x:800+Math.cos(a)*300,y:500+Math.sin(a)*200})}
  return pts;
}
function genHairpin(){
  const k=[{x:200,y:150},{x:500,y:120},{x:680,y:200},{x:730,y:380},{x:600,y:460},{x:430,y:400},{x:330,y:480},{x:280,y:580},{x:380,y:660},{x:580,y:640},{x:750,y:520},{x:800,y:350},{x:780,y:190},{x:650,y:90},{x:380,y:80},{x:180,y:110},{x:110,y:220},{x:140,y:340}];
  return interp(k,5);
}
function genCity(){
  const k=[{x:150,y:120},{x:380,y:90},{x:600,y:120},{x:740,y:230},{x:780,y:400},{x:720,y:530},{x:550,y:570},{x:380,y:540},{x:270,y:610},{x:230,y:710},{x:370,y:770},{x:550,y:740},{x:700,y:660},{x:790,y:510},{x:810,y:340},{x:770,y:190},{x:620,y:100},{x:400,y:80},{x:180,y:100},{x:100,y:230},{x:110,y:380}];
  return interp(k,4);
}
function interp(k,s){
  const pts=[];
  for(let i=0;i<k.length;i++){const a=k[i],b=k[(i+1)%k.length];for(let t=0;t<s;t++){const f=t/s;pts.push({x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f})}}
  return pts;
}

// ========== STATE ==========
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const miniCanvas=document.getElementById('minimap');
const miniCtx=miniCanvas.getContext('2d');

let car={x:0,y:0,angle:0,speed:0,drifting:false,driftTimer:0,driftAngle:0,trail:[]};
let camera={x:0,y:0};
let keys={};
let mobileSteer=0;       // -1 to 1
let mobileGas=false;
let mobileBrake=false;
let raceTime=0,lapCount=0,totalDriftScore=0,currentDriftScore=0;
let bestLapTime=Infinity,lapStartTime=0,lastCheckpoint=-1;
let trackData=null;
let particles=[],skidMarks=[];

// Touch state
let touchSteerId=null,touchSteerStartX=0;
let touchGasId=null;

// ========== RESIZE ==========
function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight}
window.addEventListener('resize',resize);resize();

// ========== BUILD TRACK ==========
function buildTrack(idx){
  const t=TRACKS[idx],pts=t.points,w=t.width;
  const inner=[],outer=[];
  for(let i=0;i<pts.length;i++){
    const prev=pts[(i-1+pts.length)%pts.length],next=pts[(i+1)%pts.length];
    const dx=next.x-prev.x,dy=next.y-prev.y,len=Math.sqrt(dx*dx+dy*dy)||1;
    const nx=-dy/len,ny=dx/len;
    inner.push({x:pts[i].x+nx*w/2,y:pts[i].y+ny*w/2});
    outer.push({x:pts[i].x-nx*w/2,y:pts[i].y-ny*w/2});
  }
  const sa=Math.atan2(pts[1].y-pts[0].y,pts[1].x-pts[0].x);
  trackData={center:pts,inner,outer,width:w,startX:pts[0].x,startY:pts[0].y,startAngle:sa,totalLaps:t.laps,numPoints:pts.length};
  car={x:trackData.startX,y:trackData.startY,angle:trackData.startAngle,speed:0,drifting:false,driftTimer:0,driftAngle:0,trail:[]};
  lastCheckpoint=0;lapCount=0;raceTime=0;totalDriftScore=0;currentDriftScore=0;bestLapTime=Infinity;lapStartTime=0;
  particles=[];skidMarks=[];mobileSteer=0;mobileGas=false;mobileBrake=false;
}

// ========== CLOSEST TRACK POINT ==========
function trackInfo(x,y){
  let minD=Infinity,ci=0;
  for(let i=0;i<trackData.center.length;i++){const dx=x-trackData.center[i].x,dy=y-trackData.center[i].y,d=dx*dx+dy*dy;if(d<minD){minD=d;ci=i}}
  const di=Math.sqrt((x-trackData.inner[ci].x)**2+(y-trackData.inner[ci].y)**2);
  const d_o=Math.sqrt((x-trackData.outer[ci].x)**2+(y-trackData.outer[ci].y)**2);
  return{idx:ci,dist:Math.sqrt(minD),onTrack:di<trackData.width*.75&&d_o<trackData.width*.75};
}

// ========== PHYSICS ==========
const MAX_SPEED=9,ACCEL=.14,BRAKE_F=.16,FRICTION=.022,OFF_FRICTION=.09;
const TURN_SPEED=.042,DRIFT_TURN=.065,DRIFT_FRICTION=.018;
const AUTO_DRIFT_SPEED=4.5; // speed threshold for auto-drift
const AUTO_DRIFT_TURN=.035;  // turn rate threshold for auto-drift

let currentTurnRate=0;

function updatePhysics(dt){
  // Determine steering input
  let steerInput=0;
  if(keys['ArrowLeft']||keys['a']||keys['A']) steerInput-=1;
  if(keys['ArrowRight']||keys['d']||keys['D']) steerInput+=1;
  steerInput+=mobileSteer;
  steerInput=Math.max(-1,Math.min(1,steerInput));
  
  // Gas / brake
  let gasInput=keys['ArrowUp']||keys['w']||keys['W']||mobileGas;
  let brakeInput=keys['ArrowDown']||keys['s']||keys['S']||mobileBrake;
  
  // Manual drift (space) or mobile drift button
  let manualDrift=keys['Space']||keys[' '];
  
  // Acceleration
  if(gasInput) car.speed+=ACCEL;
  if(brakeInput) car.speed-=BRAKE_F;
  
  // Steering
  const absSpeed=Math.abs(car.speed);
  const speedFactor=Math.min(absSpeed/3.5,1);
  
  // Calculate turn rate
  let turnRate=steerInput*TURN_SPEED*speedFactor*(car.speed>=0?1:-1);
  
  // AUTO-DRIFT: if turning sharply at high speed, auto engage drift
  let isAutoDrift=absSpeed>AUTO_DRIFT_SPEED&&Math.abs(turnRate)>AUTO_DRIFT_TURN;
  let isDrift=manualDrift&&absSpeed>2||isAutoDrift;
  
  if(isDrift){
    turnRate=steerInput*DRIFT_TURN*speedFactor*(car.speed>=0?1:-1);
  }
  
  car.angle+=turnRate;
  currentTurnRate=turnRate;
  
  // Friction
  const info=trackInfo(car.x,car.y);
  const fric=info.onTrack?(isDrift?DRIFT_FRICTION:FRICTION):OFF_FRICTION;
  if(car.speed>0) car.speed=Math.max(0,car.speed-fric);
  else if(car.speed<0) car.speed=Math.min(0,car.speed+fric);
  
  // Off-road penalty
  if(!info.onTrack&&Math.abs(car.speed)>4) car.speed*=.97;
  
  car.speed=Math.max(-MAX_SPEED*.35,Math.min(MAX_SPEED,car.speed));
  
  // Move
  car.x+=Math.cos(car.angle)*car.speed;
  car.y+=Math.sin(car.angle)*car.speed;
  
  // Drift effects
  car.drifting=isDrift;
  if(isDrift&&absSpeed>2){
    car.driftTimer+=dt;
    currentDriftScore+=absSpeed*dt*12;
    
    if(Math.random()<.6) skidMarks.push({x:car.x,y:car.y,age:0});
    if(skidMarks.length>300) skidMarks.shift();
    
    if(Math.random()<.5) particles.push({
      x:car.x-Math.cos(car.angle)*14+(Math.random()-.5)*12,
      y:car.y-Math.sin(car.angle)*14+(Math.random()-.5)*12,
      vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,
      life:.5+Math.random()*.5,maxLife:1,
      color:Math.random()<.5?'#ff6b35':'#ffd700',
      size:2+Math.random()*4
    });
    
    // Extra smoke for auto-drift
    if(isAutoDrift&&Math.random()<.3) particles.push({
      x:car.x-Math.cos(car.angle)*10+(Math.random()-.5)*8,
      y:car.y-Math.sin(car.angle)*10+(Math.random()-.5)*8,
      vx:(Math.random()-.5)*1.5,vy:(Math.random()-.5)*1.5,
      life:.4+Math.random()*.4,maxLife:.8,
      color:'rgba(200,200,200,0.6)',size:3+Math.random()*5
    });
  } else {
    if(car.driftTimer>.2&&currentDriftScore>8) totalDriftScore+=Math.floor(currentDriftScore);
    car.driftTimer=0;currentDriftScore=0;
  }
  
  // Update particles
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.life-=dt;p.vx*=.95;p.vy*=.95});
  particles=particles.filter(p=>p.life>0);
  skidMarks.forEach(s=>s.age+=dt);
  skidMarks=skidMarks.filter(s=>s.age<10);
  
  car.trail.push({x:car.x,y:car.y});
  if(car.trail.length>30) car.trail.shift();
  
  // Lap detection
  if(info.idx>=0){
    const half=Math.floor(trackData.numPoints/2);
    if(info.idx>half-4&&info.idx<half+4&&lastCheckpoint===0) lastCheckpoint=1;
    if(info.idx<4&&lastCheckpoint===1){
      lapCount++;lastCheckpoint=0;
      const lt=raceTime-lapStartTime;
      if(lt<bestLapTime&&lapCount>1) bestLapTime=lt;
      lapStartTime=raceTime;
      if(lapCount>=trackData.totalLaps) finishRace();
    }
  }
}

// ========== RENDERING ==========
function drawGame(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  camera.x=car.x-canvas.width/2;
  camera.y=car.y-canvas.height/2;
  ctx.save();ctx.translate(-camera.x,-camera.y);
  drawGround();drawSkidMarks();drawTrack();drawParticles();drawCar();
  ctx.restore();
}

function drawGround(){
  const gx=Math.floor(camera.x/80)*80,gy=Math.floor(camera.y/80)*80;
  for(let x=gx-80;x<camera.x+canvas.width+80;x+=80){
    for(let y=gy-80;y<camera.y+canvas.height+80;y+=80){
      ctx.fillStyle=((Math.floor(x/80)+Math.floor(y/80))%2===0)?'#1a3d1a':'#1e4a1e';
      ctx.fillRect(x,y,80,80);
    }
  }
}

function drawTrack(){
  if(!trackData)return;
  const pts=trackData.center;
  
  // Road base
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.lineWidth=trackData.width;ctx.strokeStyle='#3a3a4a';ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();
  
  // Road surface
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.lineWidth=trackData.width-10;ctx.strokeStyle='#505068';ctx.stroke();
  
  // Racing line markings
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);
  for(let i=1;i<pts.length;i++) ctx.lineTo(pts[i].x,pts[i].y);
  ctx.closePath();ctx.lineWidth=2;ctx.setLineDash([20,20]);ctx.strokeStyle='rgba(255,255,255,.2)';ctx.stroke();ctx.setLineDash([]);
  
  // Curbs
  drawCurb(trackData.inner);drawCurb(trackData.outer);
  
  // Start/finish
  const si=trackData.inner[0],so=trackData.outer[0];
  ctx.beginPath();ctx.moveTo(si.x,si.y);ctx.lineTo(so.x,so.y);
  ctx.lineWidth=8;ctx.strokeStyle='#fff';ctx.stroke();
  // Checkers
  const dx=so.x-si.x,dy=so.y-si.y;
  for(let i=0;i<8;i++){
    if(i%2===0){ctx.fillStyle='#222';ctx.fillRect(si.x+dx*i/8-3,si.y+dy*i/8-3,6,6)}
  }
}

function drawCurb(edge){
  for(let i=0;i<edge.length;i++){
    const n=edge[(i+1)%edge.length];
    ctx.beginPath();ctx.moveTo(edge[i].x,edge[i].y);ctx.lineTo(n.x,n.y);
    ctx.lineWidth=6;ctx.strokeStyle=i%2===0?'#ff3e3e':'#fff';ctx.stroke();
  }
}

function drawSkidMarks(){
  skidMarks.forEach(s=>{const a=Math.max(0,1-s.age/10)*.35;ctx.fillStyle=`rgba(30,30,30,${a})`;ctx.beginPath();ctx.arc(s.x,s.y,3,0,Math.PI*2);ctx.fill()});
}

function drawParticles(){
  particles.forEach(p=>{ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size*(p.life/p.maxLife),0,Math.PI*2);ctx.fill()});
  ctx.globalAlpha=1;
}

function drawCar(){
  ctx.save();ctx.translate(car.x,car.y);ctx.rotate(car.angle);
  
  // Shadow
  ctx.fillStyle='rgba(0,0,0,.35)';
  ctx.beginPath();ctx.roundRect(-15,-9,30,18,4);ctx.fill();
  
  // Body
  const g=ctx.createLinearGradient(-13,0,13,0);
  g.addColorStop(0,'#cc0000');g.addColorStop(.5,'#ff4444');g.addColorStop(1,'#cc0000');
  ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-13,-8,26,16,3);ctx.fill();
  
  // Racing stripe
  ctx.fillStyle='rgba(255,255,255,.15)';
  ctx.fillRect(-10,-1.5,20,3);
  
  // Windshield
  ctx.fillStyle='rgba(100,200,255,.55)';ctx.fillRect(5,-6,5,12);
  
  // Headlights
  ctx.fillStyle='#ffffcc';ctx.fillRect(12,-5,2,3);ctx.fillRect(12,2,2,3);
  
  // Taillights
  ctx.fillStyle=car.brifting?'#ff0':'#f44';ctx.fillRect(-13,-5,2,3);ctx.fillRect(-13,2,2,3);
  
  // Drift smoke
  if(car.drifting){
    ctx.fillStyle='rgba(220,220,220,.35)';
    for(let i=0;i<3;i++){
      ctx.beginPath();ctx.arc(-16+Math.random()*4,-6+Math.random()*4,3+Math.random()*4,0,Math.PI*2);ctx.fill();
      ctx.beginPath();ctx.arc(-16+Math.random()*4,6+Math.random()*4,3+Math.random()*4,0,Math.PI*2);ctx.fill();
    }
  }
  
  ctx.restore();
  
  // Speed lines when fast
  if(Math.abs(car.speed)>6){
    ctx.globalAlpha=.15;
    for(let i=0;i<3;i++){
      const ox=(Math.random()-.5)*40,oy=(Math.random()-.5)*40;
      ctx.strokeStyle='var(--cyan)';ctx.lineWidth=1;
      ctx.beginPath();
      ctx.moveTo(car.x+ox,car.y+oy);
      ctx.lineTo(car.x+ox-Math.cos(car.angle)*30,car.y+oy-Math.sin(car.angle)*30);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }
}

// ========== MINIMAP ==========
function drawMinimap(){
  if(!trackData)return;
  const mc=miniCtx,mw=120,mh=120;
  mc.clearRect(0,0,mw,mh);mc.fillStyle='rgba(10,10,20,.85)';mc.fillRect(0,0,mw,mh);
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  trackData.center.forEach(p=>{if(p.x<minX)minX=p.x;if(p.x>maxX)maxX=p.x;if(p.y<minY)minY=p.y;if(p.y>maxY)maxY=p.y});
  const pad=12,sc=Math.min((mw-pad*2)/(maxX-minX),(mh-pad*2)/(maxY-minY));
  const ox=(mw-(maxX-minX)*sc)/2,oy=(mh-(maxY-minY)*sc)/2;
  mc.beginPath();
  trackData.center.forEach((p,i)=>{const sx=(p.x-minX)*sc+ox,sy=(p.y-minY)*sc+oy;i===0?mc.moveTo(sx,sy):mc.lineTo(sx,sy)});
  mc.closePath();mc.lineWidth=4;mc.strokeStyle='#4a4a5a';mc.stroke();
  const cx=(car.x-minX)*sc+ox,cy=(car.y-minY)*sc+oy;
  mc.fillStyle='#ff3e3e';mc.beginPath();mc.arc(cx,cy,4,0,Math.PI*2);mc.fill();
  mc.fillStyle='rgba(255,62,62,.25)';mc.beginPath();mc.arc(cx,cy,8,0,Math.PI*2);mc.fill();
}

// ========== HUD ==========
function updateHUD(){
  const spd=Math.abs(Math.round(car.speed*25));
  document.getElementById('speedVal').textContent=spd;
  document.getElementById('speedBar').style.width=(spd/225*100)+'%';
  document.getElementById('lapVal').textContent=Math.min(lapCount+1,trackData.totalLaps)+'/'+trackData.totalLaps;
  document.getElementById('driftScore').textContent=totalDriftScore+Math.floor(currentDriftScore);
  const di=document.getElementById('driftInd');
  if(car.drifting&&car.driftTimer>.15){
    di.classList.add('active');
    di.textContent='🔥 DRIFT! +'+Math.floor(currentDriftScore);
  } else di.classList.remove('active');
  if(gameState==='playing') raceTime+=1/60;
  document.getElementById('timeVal').textContent=fmtTime(raceTime);
}
function fmtTime(t){const m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t*10)%10);return m+':'+String(s).padStart(2,'0')+'.'+ms}

// ========== GAME LOOP ==========
let lastTime=0;
function loop(ts){
  const dt=Math.min((ts-lastTime)/1000,.05);lastTime=ts;
  if(gameState==='playing') updatePhysics(dt);
  if(gameState==='playing'||gameState==='countdown'){drawGame();drawMinimap();updateHUD()}
  requestAnimationFrame(loop);
}

// ========== START / FINISH ==========
function startGame(){
  document.getElementById('startScreen').classList.add('hidden');
  buildTrack(selectedTrack);
  gameState='countdown';
  document.getElementById('hud').style.display='';
  document.getElementById('minimapWrap').style.display='';
  const cd=document.getElementById('countdown');let c=3;
  cd.style.display='block';cd.textContent=c;
  const iv=setInterval(()=>{
    c--;
    if(c>0){cd.textContent=c;cd.style.animation='none';cd.offsetHeight;cd.style.animation='countPop .4s ease'}
    else if(c===0){cd.textContent='GO!';cd.style.color='var(--green)';cd.style.animation='none';cd.offsetHeight;cd.style.animation='countPop .4s ease'}
    else{cd.style.display='none';cd.style.color='var(--accent)';gameState='playing';clearInterval(iv)}
  },800);
}

function finishRace(){
  gameState='finished';
  document.getElementById('finishTime').textContent=fmtTime(raceTime);
  document.getElementById('finishStats').innerHTML='漂移总分：'+totalDriftScore+'<br>最快单圈：'+(bestLapTime<Infinity?fmtTime(bestLapTime):'—');
  document.getElementById('finishOverlay').classList.add('show');
}
function restartGame(){document.getElementById('finishOverlay').classList.remove('show');buildTrack(selectedTrack);gameState='playing'}
function backToMenu(){
  document.getElementById('finishOverlay').classList.remove('show');
  document.getElementById('hud').style.display='none';document.getElementById('minimapWrap').style.display='none';
  document.getElementById('startScreen').classList.remove('hidden');gameState='menu';
}

// ========== KEYBOARD INPUT ==========
document.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
document.addEventListener('keyup',e=>{keys[e.key]=false});

// ========== TOUCH INPUT ==========
const isMobile=/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)||window.innerWidth<=900;

// Steering zone (left 70% of screen)
const steerZone=document.getElementById('steerZone');
steerZone.addEventListener('touchstart',e=>{
  e.preventDefault();
  if(touchSteerId===null){
    const t=e.changedTouches[0];
    touchSteerId=t.identifier;touchSteerStartX=t.clientX;
  }
},{passive:false});

steerZone.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===touchSteerId){
      const dx=t.clientX-touchSteerStartX;
      mobileSteer=Math.max(-1,Math.min(1,dx/80)); // 80px = full steer
    }
  }
},{passive:false});

steerZone.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===touchSteerId){touchSteerId=null;mobileSteer=0}
  }
});
steerZone.addEventListener('touchcancel',e=>{
  for(const t of e.changedTouches){
    if(t.identifier===touchSteerId){touchSteerId=null;mobileSteer=0}
  }
});

// Gas zone (right 30% of screen, top 70%)
const gasZone=document.getElementById('gasZone');
gasZone.addEventListener('touchstart',e=>{e.preventDefault();mobileGas=true;touchGasId=e.changedTouches[0].identifier},{passive:false});
gasZone.addEventListener('touchend',e=>{
  for(const t of e.changedTouches){if(t.identifier===touchGasId){mobileGas=false;touchGasId=null}}
});
gasZone.addEventListener('touchcancel',e=>{mobileGas=false;touchGasId=null});

// Brake button
const brakeZone=document.getElementById('brakeZone');
brakeZone.addEventListener('touchstart',e=>{e.preventDefault();mobileBrake=true;brakeZone.classList.add('pressed')},{passive:false});
brakeZone.addEventListener('touchend',e=>{e.preventDefault();mobileBrake=false;brakeZone.classList.remove('pressed')},{passive:false});
brakeZone.addEventListener('touchcancel',()=>{mobileBrake=false;brakeZone.classList.remove('pressed')});

// Prevent default touch on body
document.body.addEventListener('touchmove',e=>{if(gameState==='playing')e.preventDefault()},{passive:false});

// ========== TRACK SELECT UI ==========
function buildUI(){
  const c=document.getElementById('trackSelect');
  TRACKS.forEach((t,i)=>{
    const b=document.createElement('div');
    b.className='track-btn'+(i===selectedTrack?' active':'');
    b.innerHTML=`<div class="name">${t.name}</div><div class="desc">${t.desc}</div>`;
    b.onclick=()=>{selectedTrack=i;document.querySelectorAll('.track-btn').forEach(x=>x.classList.remove('active'));b.classList.add('active')};
    c.appendChild(b);
  });
  
  const hint=document.getElementById('controlsHint');
  if(isMobile){
    hint.innerHTML='👆 左侧滑动 = 转向<br>👉 右侧按住 = 加速<br>🛑 刹车键 = 减速<br>🔥 高速急弯 = 自动漂移！';
  } else {
    hint.innerHTML='<kbd>W</kbd>/<kbd>↑</kbd> 加速 &nbsp; <kbd>S</kbd>/<kbd>↓</kbd> 刹车<br><kbd>A</kbd>/<kbd>←</kbd> 左转 &nbsp; <kbd>D</kbd>/<kbd>→</kbd> 右转 &nbsp; <kbd>Space</kbd> 手动漂移<br>🔥 高速急弯 = 自动漂移！';
  }
}

// ========== POLYFILL ==========
if(!CanvasRenderingContext2D.prototype.roundRect){
  CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){
    r=Math.min(r||0,w/2,h/2);this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.arcTo(x+w,y,x+w,y+r,r);
    this.lineTo(x+w,y+h-r);this.arcTo(x+w,y+h,x+w-r,y+h,r);this.lineTo(x+r,y+h);this.arcTo(x,y+h,x,y+h-r,r);
    this.lineTo(x,y+r);this.arcTo(x,y,x+r,y,r);this.closePath();
  };
}

// ========== INIT ==========
buildUI();buildTrack(0);requestAnimationFrame(loop);
</script>
