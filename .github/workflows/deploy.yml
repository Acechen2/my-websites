name: Deploy to Retiehe

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Retiehe
        env:
          RTH_API_KEY: ${{ secrets.RTH_API_KEY }}
        run: |
          curl -X POST "https://host.retiehe.com/api/deploy" \
            -H "Authorization: Bearer $RTH_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"site": "mytest123.rth1.xyz", "dist": "."}'
